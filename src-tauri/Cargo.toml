[package]
name = "clod-helper"
version = "0.5.0"
description = "РЈСЃС‚Р°РЅРѕРІС‰РёРє Claude Code Рё Claude Desktop С‡РµСЂРµР· РїСЂРѕРєСЃРё"
authors = ["iimperium"]
edition = "2021"

[lib]
name = "clod_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png вЂ” СЃРјРµРЅР° РёРєРѕРЅРєРё С‚СЂРµСЏ РЅР° Р»РµС‚Сѓ (Р¶РёРІРѕР№ СЃС‚Р°С‚СѓСЃ РјРѕСЃС‚Р°)
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
# РЎРёСЃС‚РµРјРЅС‹Рµ С‚РѕСЃС‚С‹ (РјРѕСЃС‚ СѓРїР°Р»/РѕР¶РёР», РІС‹СЃРѕРєРёР№ РїРёРЅРі)
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
regex = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
url = "2"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.32"
dirs = "5"
tauri-plugin-dialog = "2.7.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
