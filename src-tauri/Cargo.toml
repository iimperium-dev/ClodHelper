[package]
name = "clod-helper"
version = "0.8.3"
description = "Установщик Claude Code и Claude Desktop через прокси"
authors = ["iimperium"]
edition = "2021"

[lib]
name = "clod_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sha2 = "0.10"
# image-png — смена иконки трея на лету (живой статус моста)
# macos-private-api — прозрачный трей-попап на macOS (на Windows — no-op).
# Версии крейтов Tauri — не ниже npm-пакетов (@tauri-apps/*): tauri build
# падает, если major.minor расходятся, а Cargo.lock в git не хранится.
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-shell = "2.5"
tauri-plugin-autostart = "2"
# Системные тосты (мост упал/ожил, высокий пинг)
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
regex = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "socks"], default-features = false }
url = "2"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.32"
dirs = "5"
tauri-plugin-dialog = "2.8.3"

# Windows: быстрые статусы без PowerShell — реестр (политики, правила
# брандмауэра, пакеты Store), таблица TCP-соединений, иконки exe в PNG.
# Все три крейта уже приходят с Tauri — сборка не тяжелеет.
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"
png = "0.18"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinInet",
  "Win32_Networking_WinSock",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Автозапуск на macOS: SMAppService (13+) — штатные «Объекты входа» с
# иконкой и именем приложения вместо LaunchAgent «Clod Helper.plist».
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSUserDefaults"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
