<div id="root"></div>
<!--
  Стенд интерфейса без Tauri: подставной бэкенд с реалистичными данными.
  npm run mock → http://localhost:1420/mock.html (в vite build не входит).
  ?still - без анимаций (для снимков), ?platform=win - интерфейс Windows,
  ?fresh - первый запуск: моста ещё нет, открывается мастер (?wizfail -
  установка падает на проверке, ?wizslow - фазы идут медленно, ?wizhold - после
  всех фаз шаг ждёт window.__wizRelease(), чтобы тест успел прочитать строки).
  Мастер и приложения: ?noclaude / ?nocodex - их нет, шаг «Приложения» предложит
  поставить; window.__install("claude"|"codex") - установка закончилась (?autoinstall -
  сама через 2 с после «Установить»); window.__opened - открытые магазины;
  ?claudeerr - Claude Desktop не подключился; ?claudeopen - был открыт (кнопка «Перезапустить»).
  ?whatsnew - окно «Что нового» после обновления; ?autooffer - затем
  предложение включить автообновление (установка до этой функции).
  ?noticebanner - обычная установка, автообновление уже отвечено, переключатели ещё не показывали
  (плашка про отчёты; ?newinstall - без «С этой версии»); window.__noticeSeen() - флаг privacy_notice_seen.
  ?statsoff - ответ уже был; ?privacyfail - privacy_get падает, пока window.__privacyFailOff не true.
  ?reportlimit (429) и ?reportbusy (503) - ошибка отправки; ?reportslow - отправка 9 секунд; __reportNonces.
  ?reportfail - отправка отчёта падает; window.__privacy(), __reports, __uiErrors - для тестов.
  ?claudedirect - Claude Desktop открыт без прокси («Открыть» предлагает перезапуск); ?relaunchfail - перезапуск не вышел.
  ?deeplink - программа открыта ссылкой clodhelper://add?key=... (купленный прокси, новый адрес);
  ?deeplink=update - тот же адрес уже в пуле, ?deeplink=fail - магазин не ответил.
  ?shopproxy - в пуле прокси из магазина со сроком, ?shopproxy=expired - срок прошёл, прокси не отвечает.
  __shopAdds, __shopRemembered, __renewed - что окно отправило в магазинные команды.
  window.__shopLink() - ссылка пришла в уже запущенную программу; __shopClaims - запрошенные ключи.
  ?cause=auth|silent|closed|5xx|bridge - второй прокси не работает по этой причине (на «Обзоре» -
  раскрытие с причиной и кнопкой); ?ru - основной прокси в России (флаг из кэша гео).
  ?vpn=wg|tun - включён VPN WireGuard / безымянный туннель; ?vpn=sota - SOTA VPN стёр
  прокси-переменные. window.__replaced - вызовы proxy_replace.
  ?down=1&oldname - у неработающего третьего прокси есть имя «CD - old2»; ?muted - предупреждение
  о нём скрыто (proxy_alerts_muted_get).
  ?live - мост каждые 5 с шлёт событие bridge-health с растущими счётчиками (как монитор
  программы); ?live=same - один и тот же снимок; ?livems=1000 - другой период.
  window.__healthEvents - сколько событий отправлено. ?slowboot - settings_get отвечает 1,5 с
  (заставка «Проверяю…» при запуске).
  ?notask - задача автозапуска моста пропала (?taskfail - «Исправить» падает); ?checkfail - проверка
  приватности падает, связь есть; ?testfail - тест соединения не прошёл; ?removefail - «Убрать из
  списка» падает. Остановка моста идёт 0,7 с (видно спиннер).
  Используется тестами tests/ui (Playwright).
-->

  const SITES = {

    system_pac_status: { supported: true, enabled: true, active: true, foreign: null },
    sites_scope_get: { supported: true, selected: false, browsers: BROWSERS_DEMO ? BROWSERS_DEMO.scope : [] },
    sites_proxy_extensions: [],
    sites_bypass_get: [],
    ...(BROWSERS_DEMO ? { sites_bypass_candidates: BROWSERS_DEMO.candidates, sites_bypass_get: [BROWSERS_DEMO.candidates[2]] } : {}),
    google_ads_get: true,
  };
  // Фото и видео баннера: ключ - файл стенда в mock-assets.
  const MOCK_FILES = { ["a".repeat(64) + ".jpg"]: "cover.jpg", ["b".repeat(64) + ".mp4"]: "clip.mp4",
    ["c".repeat(64) + ".jpg"]: "clip-poster.jpg", ["d".repeat(64) + ".jpg"]: "photo2.jpg" };
  const MOCK_MEDIA = [
    { key: "a".repeat(64) + ".jpg", kind: "image", w: 1200, h: 600 },
    { key: "b".repeat(64) + ".mp4", kind: "video", w: 640, h: 360, poster: "c".repeat(64) + ".jpg" },
    { key: "d".repeat(64) + ".jpg", kind: "image", w: 1200, h: 900 },
  ];
  const R = {
    settings_get: { proxy_url: "http://u:p@185.68.187.138:8000" },
    shim_script_path: "/x",
    shim_status: { running: true, pid: 1, uptime_sec: 28000, listen: "127.0.0.1:8889" },
    shim_test: { ok: true, latency_ms: 420, external_ip: "185.68.187.138", error: null },
    bridge_health: health,
    bridge_task_status: params.has("notask") ? { registered: false, state: null } : { registered: true, state: "Running" },
    bridge_exe_legacy: false,
    bridge_versions: { installed: "1.8.0", bundled: "1.8.0", outdated: false },
    global_proxy_env: params.get("vpn") === "sota"
      ? { present: false, points_to_bridge: false, values: [] }
      : { present: true, points_to_bridge: true, values: [] },
    proxies_ping: [
      { url: "http://u:p@185.68.187.138:8000", host: "185.68.187.138", port: 8000, ms: 74 },
      { url: "socks5://u:p@93.1.2.3:1080", host: "93.1.2.3", port: 1080, ms: ["2", "all"].includes(params.get("down")) ? null : 131 },
      ...(params.has("down") ? [{ url: "http://u:p@193.8.114.42:8080", host: "193.8.114.42", port: 8080, ms: null }] : []),
    ]
      .map((x, i) => (params.get("down") === "all" && i === 0 ? { ...x, ms: null } : x))
      .map((x, i) => (i === 1 && CAUSES[cause] ? { ...x, ...CAUSES[cause] } : x))
      // ?cause=bridge - своей проверки второго прокси ещё нет, судим по мосту.
      .filter((_, i) => !(cause === "bridge" && i === 1)),
    vpn_status: VPN[params.get("vpn")] || { active: false, name: null, sota: false },
    apps_list: apps,
    apps_traffic: [
      { id: "claude-desktop", running: true, via_bridge: 6, direct: 0, proxy_extension: null },
      { id: "codex", running: true, via_bridge: 12, direct: 0, proxy_extension: null },
      // ?tg=other - Telegram ходит через чужой локальный прокси (tg-ws-proxy).
      // ?tg=blocked - защита закрывает Telegram, прокси в нём не включён: без связи.
      params.get("tg") === "blocked"
        ? { id: "telegram", running: true, via_bridge: 0, direct: 0, proxy_extension: null }
        : params.get("tg") === "other"
        ? { id: "telegram", running: true, via_bridge: 0, direct: 0, proxy_extension: null, other_proxy: "127.0.0.1:1442" }
        : { id: "telegram", running: true, via_bridge: 4, direct: 0, proxy_extension: null },
      { id: "custom-1", running: true, via_bridge: 0, direct: 9, proxy_extension: { id: "foxy", name: "FoxyProxy" } },
    ],
    apps_icons: BROWSERS_DEMO ? BROWSERS_DEMO.exe : {},
    claude_proxy_status: {
      policy: { configured: true, managed: true, conflict: null, proxy_url: "http://127.0.0.1:8890", pac_configured: false, notice: null, auto_restore: true },
      bridge_ready: true, bridge_error: null, network_enforced: false,
    },
    telegram_status: { supported: true, app_path: "/Applications/Telegram.app", running: true, socks_ready: true, via_bridge: 4, direct: 0 },
    // ?down=1 - один прокси пула не отвечает, ?down=2 - два, ?down=all - все.
    proxies_get: params.has("down")
      ? ["http://u:p@185.68.187.138:8000", "socks5://u:p@93.1.2.3:1080", "http://u:p@193.8.114.42:8080"]
      : ["http://u:p@185.68.187.138:8000", "socks5://u:p@93.1.2.3:1080"],
    proxy_labels_get: { "http://u:p@185.68.187.138:8000": "Claude main" },
    proxy_assignments_get: { anthropic: 0 },
    apps_search: [{ name: "WeChat", path: win ? "C:\\Program Files\\Tencent\\Weixin\\Weixin.exe" : "/Applications/WeChat.app" }],

    browser_policy_status: { configured: false, managed: false, conflict: null, auto_restore: false, server: "", notice: null },

    },
    update_check: { version: "0.7.0", notes: "", url: "x", sums_url: "y", page: "https://example.com/release",

    notices_list: params.has("notice")
      ? [{ id: "whats-new-0-9-1", kind: "news", date: "2026-11-11", title: "Вышла версия 0.9.1", body: "Что изменилось в этой версии.", link: "https://example.com/new", link_label: "Что нового", read: false },
