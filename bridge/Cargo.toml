[package]
name = "clod-bridge"
version = "1.8.1"
edition = "2021"
description = "Локальный HTTP-прокси-мост: no-auth localhost → auth upstream, с domain-routing и failover"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
socket2 = { version = "0.5", features = ["all"] }
url = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
winresource = "0.1"

# Маленький exe: он копируется в resources и ставится каждому пользователю.
[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

# Без PDB у build-скрипта: link.exe (LNK1318) падает на PDB-путях с эмодзи
# (папка репозитория ⭐️…⭐️), а дебаг-инфо build-скрипту не нужна.
[profile.release.build-override]
debug = false
strip = "debuginfo"
