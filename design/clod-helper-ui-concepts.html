  .stage-wrap{flex:1;min-height:0;background:#fff}

<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clod Helper — Vantablack Refined</title>
<style>
  :root{
    /* palette */
    --bg:#000000;
    --panel:#0A0A0A;
    --panel-2:#0C0C0C;
    --panel-3:#060606;
    --line:rgba(255,255,255,.075);
    --line-soft:rgba(255,255,255,.045);
    --line-faint:rgba(255,255,255,.028);
    --inset:rgba(255,255,255,.045);
    --silver:#D4D4D8;
    --silver-bright:#EDEDF0;
    --muted:#97979E;
    --dim:#67676E;
    --dimmer:#48484E;
    --emerald:#10B981;
    --emerald-soft:#5EE3B6;
    --emerald-dim:#0C8F66;
    --amber:#E0A93B;
    --amber-soft:#F0C878;
    --red:#E5484D;
    --red-soft:#F1A0A3;
    /* radii (4/8 family) */
    --r-lg:16px;
    --r-md:12px;
    --r-sm:9px;
    --r-xs:7px;
    --r-pill:999px;
    /* elevation */
    --sh-win:0 28px 64px -30px rgba(0,0,0,.92), 0 4px 14px -6px rgba(0,0,0,.7);
    --sh-card:inset 0 1px 0 var(--inset);
    --sh-float:0 32px 72px -28px rgba(0,0,0,.95), inset 0 1px 0 var(--inset);
    --sh-cta:0 0 0 1px rgba(16,185,129,.28), 0 12px 32px -12px rgba(16,185,129,.6), inset 0 1px 0 rgba(255,255,255,.28);
    --glow-emerald:0 0 0 3px rgba(16,185,129,.13);
    /* type */
    --mono:ui-monospace,'JetBrains Mono','SF Mono',Consolas,monospace;
    --sans:-apple-system,'Segoe UI',Inter,Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--silver);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  body{
    background:
      radial-gradient(1300px 760px at 50% -300px, rgba(16,185,129,.06), transparent 62%),
      radial-gradient(1000px 560px at 92% 4%, rgba(255,255,255,.02), transparent 56%),
      var(--bg);
    padding:56px 24px 96px;
    font-size:14px;
    line-height:1.5;
  }
  .wrap{max-width:1180px;margin:0 auto;}
  ::selection{background:rgba(16,185,129,.28);color:#eafff6}

  /* ---------- Header ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:8px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:16px;}
  .logo{
    width:48px;height:48px;border-radius:14px;
    background:linear-gradient(160deg,#121212,#040404);
    border:1px solid var(--line);
    box-shadow:inset 0 1px 0 var(--inset), 0 8px 24px -8px rgba(0,0,0,.7), 0 0 0 4px rgba(16,185,129,.04);
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .logo::after{content:"";position:absolute;inset:0;border-radius:14px;box-shadow:inset 0 0 24px rgba(16,185,129,.08);pointer-events:none}
  .logo svg{width:25px;height:25px;}
  .brand h1{font-size:20px;font-weight:660;letter-spacing:.2px;margin:0;color:var(--silver-bright);}
  .brand .sub{font-size:12.5px;color:var(--muted);margin-top:3px;letter-spacing:.1px;}
  .os-switch{
    display:inline-flex;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:4px;box-shadow:inset 0 1px 0 var(--inset);gap:2px;
  }
  .os-switch button{
    border:0;background:transparent;color:var(--muted);font-family:var(--sans);
    font-size:13px;font-weight:560;padding:8px 16px;border-radius:9px;display:flex;align-items:center;gap:8px;cursor:default;letter-spacing:.1px;
  }
  .os-switch .on{background:linear-gradient(180deg,#181818,#0c0c0c);color:var(--silver-bright);box-shadow:inset 0 1px 0 var(--inset),0 2px 6px -2px rgba(0,0,0,.6);}
  .os-switch svg{width:15px;height:15px;opacity:.92}

  .hero-tag{
    margin:18px 0 8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--dim);font-size:12px;letter-spacing:.2px;
  }
  .hero-tag .chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-pill);padding:5px 11px;color:var(--muted);font-weight:550}
  .hero-tag .chip .gd{width:7px;height:7px;border-radius:50%;background:var(--emerald);box-shadow:0 0 8px rgba(16,185,129,.7)}

  /* ---------- Section label ---------- */
  .sec{margin:48px 0 18px;display:flex;align-items:center;gap:14px;}
  .sec .num{
    width:28px;height:28px;border-radius:8px;flex:0 0 auto;
    border:1px solid rgba(16,185,129,.3);background:rgba(16,185,129,.06);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:var(--emerald-soft);
    box-shadow:inset 0 1px 0 var(--inset), 0 0 0 3px rgba(16,185,129,.03);font-variant-numeric:tabular-nums;
  }
  .sec h2{font-size:12.5px;font-weight:660;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0;}
  .sec .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);}
  .sec .os-mark{display:inline-flex;gap:6px;align-items:center;color:var(--dim);font-size:11px;letter-spacing:.4px;text-transform:uppercase;font-weight:600;}
  .sec .os-mark svg{width:13px;height:13px;opacity:.7}

  /* ---------- Grid ---------- */
  .grid{display:grid;gap:24px;}
  .g-2{grid-template-columns:1fr 1fr;}
  .g-12-7{grid-template-columns:1.22fr 1fr;}
  @media(max-width:880px){.g-2,.g-12-7{grid-template-columns:1fr;}}

  /* ---------- Window / panel ---------- */
  .win{
    position:relative;
    background:linear-gradient(180deg,#0c0c0c,#070707);
    border:1px solid var(--line);
    border-radius:var(--r-lg);
    box-shadow:var(--sh-win);
    overflow:hidden;
  }
  /* signature: emerald hairline at the very top edge of every window */
  .win::before{content:"";position:absolute;top:0;left:18px;right:18px;height:1px;background:linear-gradient(90deg,transparent,rgba(16,185,129,.4),transparent);opacity:.7;z-index:3}

  .titlebar{
    display:flex;align-items:center;gap:12px;
    height:44px;padding:0 16px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(255,255,255,.025),transparent);
  }
  .traffic{display:flex;gap:8px;align-items:center;}
  .traffic i{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.35), 0 1px 1px rgba(0,0,0,.3)}
  .traffic .r{background:#FE5F57}.traffic .y{background:#FEBC2E}.traffic .g{background:#28C840}
  .titlebar .wtitle{font-size:12.5px;color:var(--muted);font-weight:560;letter-spacing:.2px}
  .win-os{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim);}
  .win-os svg{width:13px;height:13px;opacity:.72}

  /* Windows titlebar */
  .titlebar.winstyle{justify-content:flex-start;}
  .wincontrols{margin-left:auto;display:flex;gap:0;color:var(--dim);}
  .wincontrols span{width:42px;height:44px;display:flex;align-items:center;justify-content:center;margin-right:-16px}
  .wincontrols span:last-child{}
  .wincontrols span.cls:hover{}
  .wincontrols svg{width:11px;height:11px}

  .body{padding:26px 28px;}
  .body.tight{padding:22px 24px}

  /* ---------- Typography helpers ---------- */
  .h-lead{font-size:17px;font-weight:620;letter-spacing:.1px;margin:0 0 6px;color:var(--silver-bright);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .h-note{font-size:13px;color:var(--muted);margin:0 0 24px;line-height:1.6;max-width:62ch}
  .label{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.4px;margin:0 0 10px;display:block;text-transform:uppercase}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* ---------- Inputs ---------- */
  .field{
    display:flex;align-items:center;gap:12px;
    background:var(--panel-3);border:1px solid var(--line);border-radius:var(--r-md);
    padding:13px 15px;box-shadow:inset 0 1px 0 rgba(255,255,255,.02), inset 0 0 0 1px rgba(0,0,0,.35);
    transition:.15s;
  }
  .field.focus{border-color:rgba(16,185,129,.55);box-shadow:var(--glow-emerald),inset 0 1px 0 rgba(255,255,255,.02);}
  .field .ic{color:var(--dim);display:flex}
  .field .ic svg{width:16px;height:16px}
  .field .val{flex:1;background:transparent;border:0;outline:0;color:var(--silver);font-family:var(--mono);font-size:13.5px;letter-spacing:.2px;}
  .field .obsc{color:var(--silver)}
  .field .dim{color:var(--dimmer)}

  /* ---------- Badges ---------- */
  .badge{
    display:inline-flex;align-items:center;gap:7px;
    font-size:11px;font-weight:650;letter-spacing:.3px;
    padding:5px 11px;border-radius:var(--r-pill);
    border:1px solid var(--line);background:var(--panel);color:var(--silver);
    white-space:nowrap;
  }
  .badge.proto{border-color:rgba(16,185,129,.38);background:rgba(16,185,129,.09);color:var(--emerald-soft);}
  .badge.ok{border-color:rgba(16,185,129,.32);background:rgba(16,185,129,.08);color:var(--emerald-soft);}
  .badge.warn{border-color:rgba(224,169,59,.38);background:rgba(224,169,59,.09);color:var(--amber-soft);}
  .badge.err{border-color:rgba(229,72,77,.38);background:rgba(229,72,77,.09);color:var(--red-soft);}
  .badge.flag{font-size:14px;padding:4px 9px;line-height:1}
  .badge .gd{width:7px;height:7px;border-radius:50%;background:var(--emerald);box-shadow:0 0 7px rgba(16,185,129,.7)}

  /* ---------- Live check rows ---------- */
  .checkcard{
    margin-top:18px;border:1px solid var(--line);border-radius:var(--r-md);
    background:linear-gradient(180deg,rgba(16,185,129,.025),transparent 60%);
    overflow:hidden;
  }
  .checkhead{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-soft);}
  .checkhead .ttl{font-size:12.5px;color:var(--silver);font-weight:560;}
  .checkhead .spark{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--emerald);font-weight:650;letter-spacing:.2px}
  .dotpulse{width:8px;height:8px;border-radius:50%;background:var(--emerald);box-shadow:0 0 0 0 rgba(16,185,129,.5);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.45)}70%{box-shadow:0 0 0 7px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
  .checkrows{display:grid;grid-template-columns:1fr 1fr;gap:0;}
  .crow{display:flex;align-items:center;gap:11px;padding:14px 16px;border-top:1px solid var(--line-faint);}
  .crow:nth-child(odd){border-right:1px solid var(--line-faint)}
  .crow:nth-child(-n+2){border-top:0}
  .crow .ck{flex:1;min-width:0}
  .crow .ck .k{font-size:10.5px;color:var(--dim);letter-spacing:.5px;margin-bottom:5px;text-transform:uppercase;font-weight:600}
  .crow .ck .v{font-size:13.5px;color:var(--silver);font-weight:550;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .crow .v .mono{font-size:13px}
  .crow.span{grid-column:1/-1;border-right:0;border-top:1px solid var(--line-soft)}
  .lat{color:var(--emerald)!important;font-weight:650}

  /* ---------- Buttons ---------- */

      radial-gradient(820px 440px at -8% 4%, #E4F1FF 0%, rgba(228,241,255,0) 58%),
      radial-gradient(720px 540px at 50% 120%, #E7EFFA 0%, rgba(231,239,250,0) 60%),
      linear-gradient(180deg,var(--bg-2),var(--bg));
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    line-height:1.5;
    padding:48px 24px 80px;
    min-height:100vh;
  }
  .wrap{max-width:1180px;margin:0 auto}

  /* signature frost-glint hairline at top of glass surfaces */
  .glint{position:relative}
  .glint::before{
    content:"";position:absolute;inset:0 0 auto 0;height:1px;border-radius:inherit;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.9) 18%,rgba(255,255,255,.95) 50%,rgba(255,255,255,.9) 82%,transparent);
    pointer-events:none;
  }

  /* ================= Page header ================= */
  .page-head{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:36px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:16px}
  .logo{
    width:56px;height:56px;border-radius:16px;flex:none;
    background:linear-gradient(155deg,#5B9BFF,#2563EB 58%,#1E40AF);
    box-shadow:0 12px 26px rgba(37,99,235,.34), inset 0 1px 0 rgba(255,255,255,.45);
    display:flex;align-items:center;justify-content:center;color:#fff;position:relative;overflow:hidden;
  }
  .logo::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 30% 12%,rgba(255,255,255,.5),transparent 70%)}
  .brand h1{font-size:27px;margin:0;letter-spacing:-.6px;font-weight:780}
  .brand p{margin:3px 0 0;color:var(--muted);font-size:14px;max-width:540px}

  .head-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .ver-chip{
    display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--blue-600);
    background:var(--blue-soft);border:1px solid #D5E2FF;padding:7px 12px;border-radius:var(--r-pill)
  }
  .ver-chip .lvd{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .os-switch{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:var(--sh-1)}
  .os-switch span{
    display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:650;color:var(--muted);cursor:default;transition:none
  }
  .os-switch span.on{background:linear-gradient(180deg,#2D6BF0,var(--blue));color:#fff;box-shadow:0 6px 14px rgba(37,99,235,.30), inset 0 1px 0 rgba(255,255,255,.3)}

  /* ================= Grid ================= */
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
  .col-12{grid-column:span 12}
  .col-7{grid-column:span 7}
  .col-5{grid-column:span 5}
  .col-6{grid-column:span 6}
  .col-8{grid-column:span 8}
  .col-4{grid-column:span 4}
  @media(max-width:980px){.grid{grid-template-columns:1fr;gap:20px}.col-7,.col-5,.col-6,.col-8,.col-4{grid-column:span 1}}

  .section-label{grid-column:span 12;display:flex;align-items:center;gap:14px;margin:18px 2px 2px}
  .section-label .n{
    width:28px;height:28px;border-radius:9px;
    background:linear-gradient(180deg,#fff,#F1F5FF);border:1px solid #D9E4FA;color:var(--blue-600);
    font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--sh-1)
  }
  .section-label h2{font-size:15.5px;margin:0;letter-spacing:-.1px;font-weight:750;color:var(--ink-2)}
  .section-label .line{flex:1;height:1px;background:linear-gradient(90deg,var(--line-strong),transparent)}

  /* ================= App window chrome ================= */
  .window{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--sh-4);overflow:hidden;
  }
  .titlebar{
    display:flex;align-items:center;gap:12px;padding:14px 18px;
    background:linear-gradient(180deg,#FBFDFF,#EFF4FC);
    border-bottom:1px solid var(--line);position:relative;
  }
  .traffic{display:flex;gap:8px}
  .traffic i{width:12px;height:12px;border-radius:50%;display:block;position:relative}
  .traffic .r{background:#FF5F57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
  .traffic .y{background:#FEBC2E;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
  .traffic .g{background:#28C840;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
  .titlebar .title{font-size:13px;font-weight:650;color:#51627E;margin-left:6px;letter-spacing:.1px}
  .titlebar .win-controls{margin-left:auto;display:flex;gap:20px;color:#94A3BA}
  .win-note{
    margin-left:auto;font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:7px;
    background:#fff;border:1px solid var(--line);padding:6px 11px;border-radius:var(--r-pill);box-shadow:var(--sh-1)
  }

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
    box-shadow:var(--sh-2);padding:24px;
  }
  .card h3{margin:0 0 5px;font-size:17px;font-weight:740;letter-spacing:-.3px}
  .card .sub{color:var(--muted);font-size:13.5px;margin:0 0 20px;line-height:1.55}

  /* ================= Wizard steps ================= */
  .steps{display:flex;align-items:center;gap:0;margin:6px 0 24px}
  .step{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:13px;font-weight:650;white-space:nowrap}
  .step .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line-strong);display:flex;align-items:center;justify-content:center;font-size:12.5px;background:#fff}
  .step.done{color:var(--green)}
  .step.done .dot{background:linear-gradient(180deg,#22B85B,var(--green));border-color:var(--green);color:#fff;box-shadow:0 4px 10px rgba(21,163,74,.28)}
  .step.active{color:var(--blue-600)}
  .step.active .dot{border-color:var(--blue);color:var(--blue-600);background:var(--blue-soft);box-shadow:0 0 0 5px rgba(37,99,235,.10)}
  .step-bar{flex:1;height:3px;background:var(--line);margin:0 12px;border-radius:3px;min-width:24px}
  .step-bar.fill{background:linear-gradient(90deg,var(--green),#34D07F)}

  label.fld{display:block;font-size:13px;font-weight:680;color:var(--ink-2);margin:0 0 9px}
  .input{
    display:flex;align-items:center;gap:11px;border:1.5px solid var(--blue);
    border-radius:14px;padding:14px 16px;background:#fff;
    box-shadow:0 0 0 4px rgba(37,99,235,.12), var(--sh-1);
  }
  .input svg{color:var(--blue);flex:none}
  .input .val{
    border:0;outline:0;font-family:var(--mono);font-size:14px;color:var(--ink);width:100%;background:transparent;letter-spacing:.2px
  }
  .input .clear{color:var(--faint);cursor:default;display:flex}

  .probe{margin-top:18px;border:1px solid #C9E8D5;border-radius:var(--r-md);overflow:hidden;background:#fff;box-shadow:var(--sh-1)}
  .probe .head{
    display:flex;align-items:center;gap:9px;padding:12px 18px;border-bottom:1px solid #DCF0E4;
    font-size:12.5px;font-weight:730;color:#0E7A36;background:linear-gradient(180deg,#EBF8F0,#E1F4E9)
  }
  .probe .head .pdot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(21,163,74,.18)}
  .probe .head .ms{margin-left:auto;font-weight:650;color:#3A8F5C;font-family:var(--mono);font-size:11.5px}
  .probe .body{display:grid;grid-template-columns:repeat(4,1fr)}
  .pcell{padding:15px 18px;border-right:1px solid var(--line-soft)}
  .pcell:last-child{border-right:0}
  .pcell .k{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.7px;font-weight:730;margin-bottom:6px}
  .pcell .v{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:7px}
  .flag{font-size:17px;line-height:1}

  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:730;padding:4px 11px;border-radius:var(--r-pill);letter-spacing:.2px;line-height:1.4}
  .b-blue{background:var(--blue-soft);color:var(--blue-600)}
  .b-green{background:var(--green-soft);color:#0E7A36}
  .b-amber{background:var(--amber-soft);color:#9C5A06}
  .b-red{background:var(--red-soft);color:var(--red)}
  .b-gray{background:#EFF3F9;color:#56678300;color:#566783}
  .badge .ld{width:6px;height:6px;border-radius:50%;background:currentColor}

  .wizard-foot{display:flex;align-items:center;justify-content:space-between;margin-top:24px;gap:12px;flex-wrap:wrap}
  .auto-note{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:default;
    font-size:14px;font-weight:650;border-radius:12px;padding:12px 20px;font-family:inherit;letter-spacing:.1px
  }
  .btn-primary{background:linear-gradient(180deg,#2E6CF0,var(--blue));color:#fff;box-shadow:0 9px 20px rgba(37,99,235,.32), inset 0 1px 0 rgba(255,255,255,.28)}
  .btn-ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line-strong);box-shadow:var(--sh-1)}
  .btn-sm{padding:9px 15px;font-size:13px;border-radius:10px}
  .btn-danger{background:#fff;color:var(--red);border:1px solid #F2CACA;box-shadow:var(--sh-1)}
  .btn-green{background:linear-gradient(180deg,#1FB258,var(--green));color:#fff;box-shadow:0 9px 20px rgba(21,163,74,.28)}

  /* ================= Dashboard ================= */
  .dash-hero{
    display:flex;align-items:center;gap:18px;padding:20px 22px;border:1px solid #C9E8D5;border-radius:var(--r-md);
    background:linear-gradient(135deg,#EDF9F1 0%,#F6FCFF 55%,#FFFFFF 100%);box-shadow:var(--sh-1);position:relative;overflow:hidden
  }
  .pulse{width:54px;height:54px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 12px rgba(21,163,74,.18)}
  .pulse i{width:18px;height:18px;border-radius:50%;background:linear-gradient(180deg,#2BCB6A,var(--green));box-shadow:0 0 0 6px rgba(21,163,74,.16), 0 0 0 12px rgba(21,163,74,.07)}
  .dash-hero .st{font-size:23px;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:12px}
  .dash-hero .meta{color:var(--muted);font-size:13.5px;margin-top:3px}
  .dash-hero .uptime{margin-left:auto;text-align:right}
  .dash-hero .uptime .big{font-size:23px;font-weight:820;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
  .dash-hero .uptime .lbl{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.7px;font-weight:730;margin-top:2px}

  .kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
  .kv{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:linear-gradient(180deg,#fff,#FAFCFF)}
  .kv .k{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.7px;font-weight:730;margin-bottom:7px;display:flex;align-items:center;gap:7px}
  .kv .k svg{color:var(--faint)}
  .kv .v{font-size:14px;font-weight:680}
  .kv .v.mono{font-family:var(--mono);font-size:13px;letter-spacing:.1px;word-break:break-all;font-weight:600}
  .health-bar{height:7px;border-radius:6px;background:var(--line);margin-top:9px;overflow:hidden}
  .health-bar i{display:block;height:100%;width:88%;border-radius:6px;background:linear-gradient(90deg,#34D07F,var(--green))}

  .dash-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}

  .latency-card .chart{margin-top:2px;border:1px solid var(--line);border-radius:14px;padding:16px;background:linear-gradient(180deg,#FBFDFF,#F4F8FF)}
  .spark{width:100%;height:80px;display:block}
  .latency-legend{display:flex;justify-content:space-between;margin-top:10px;font-size:11.5px;color:var(--faint);font-weight:600}
  .lat-stats{margin-top:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .lat-stats .kv{padding:11px 8px;text-align:center}
  .lat-stats .kv .k{justify-content:center;margin-bottom:5px}
  .lat-stats .kv .v{font-size:15px;font-variant-numeric:tabular-nums}

  /* ================= Settings ================= */
  .settings-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line-soft)}
  .settings-row:last-child{border-bottom:0}
  .settings-row .t{font-size:14.5px;font-weight:680}
  .settings-row .d{font-size:12.5px;color:var(--muted);margin-top:3px}
  .toggle{width:46px;height:27px;border-radius:var(--r-pill);background:linear-gradient(180deg,#2D6BF0,var(--blue));position:relative;flex:none;box-shadow:inset 0 1px 2px rgba(0,0,0,.10);margin-top:2px}
  .toggle i{position:absolute;top:3px;left:22px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.22)}
  .toggle.off{background:#CFD8E6}
  .toggle.off i{left:3px}

  .upd-banner{
    display:flex;align-items:center;gap:14px;border:1px solid #C9DCFF;
    background:linear-gradient(135deg,#EFF5FF,#E7EFFF);
    border-radius:14px;padding:14px 16px;margin-top:16px
  }
  .upd-banner .ic{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid #D2E0FB;display:flex;align-items:center;justify-content:center;color:var(--blue);flex:none;box-shadow:var(--sh-1)}
  .upd-banner .tx b{font-size:14px}
  .upd-banner .tx div{font-size:12.5px;color:var(--muted);margin-top:1px}

  .check-list{margin-top:4px}
  .check-item{display:flex;align-items:flex-start;gap:13px;padding:13px 15px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:linear-gradient(180deg,#fff,#FAFCFF)}
  .check-item:last-child{margin-bottom:0}
  .check-item.locked{background:#F6F8FC;border-style:dashed}
  .cbox{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line-strong);flex:none;margin-top:1px;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff}
  .cbox.on{background:linear-gradient(180deg,#2D6BF0,var(--blue));border-color:var(--blue);box-shadow:0 3px 8px rgba(37,99,235,.30)}
  .cbox.lock{background:#E7EBF2;border-color:#D5DDEA;color:#9CA8BC}
  .check-item .nm{font-size:14px;font-weight:680;display:flex;align-items:center;gap:8px}
  .check-item .ds{font-size:12px;color:var(--muted);margin-top:2px}
  .check-item .sz{margin-left:auto;font-size:12px;color:var(--faint);font-weight:680;white-space:nowrap;align-self:center}

  .warn-strip{margin-top:14px;display:flex;align-items:center;gap:11px;background:linear-gradient(180deg,#FBF1DC,#FAEDD0);border:1px solid #F0D8A8;border-radius:13px;padding:12px 15px}
  .warn-strip svg{flex:none}
  .warn-strip .x{font-size:12.5px;color:#8A5A12;line-height:1.5}

  /* ================= Tray / menubar ================= */
  .menu{
    width:296px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-4);overflow:hidden
  }
  .menu .m-head{padding:14px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:11px;background:linear-gradient(180deg,#FBFDFF,#F4F8FE)}
  .menu .m-head .s{width:11px;height:11px;border-radius:50%;flex:none}
  .menu .m-head .ttl{font-size:13.5px;font-weight:740}
  .menu .m-head .sub2{font-size:11.5px;color:var(--muted);margin-top:2px;font-family:var(--mono)}
  .menu .m-item{display:flex;align-items:center;gap:12px;padding:11px 16px;font-size:13.5px;color:var(--ink-2);border-bottom:1px solid #F4F7FB;font-weight:550}
  .menu .m-item:last-child{border-bottom:0}
  .menu .m-item.hover{background:var(--blue-soft);color:var(--blue-600)}
  .menu .m-item svg{color:var(--faint);flex:none}
  .menu .m-item.hover svg{color:var(--blue)}
  .menu .m-item .kbd{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
  .menu .m-sep{height:1px;background:var(--line-soft)}
  .tray-host{display:flex;flex-direction:column;align-items:center;gap:12px}
  .tray-host .host-lbl{font-size:12px;color:var(--muted);font-weight:650;display:flex;align-items:center;gap:8px}

  .three-state{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:20px}
  .ts{border:1px solid var(--line);border-radius:14px;padding:15px 12px;text-align:center;background:linear-gradient(180deg,#fff,#FAFCFF)}
  .ts .led{width:14px;height:14px;border-radius:50%;margin:0 auto 10px}
  .ts .lbl{font-size:12.5px;font-weight:740}
  .ts .ds{font-size:11px;color:var(--muted);margin-top:3px}

  /* ================= Cross-platform card ================= */
  .platform-tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:740;padding:3px 8px;border-radius:7px;background:#EFF3F9;color:#566783;letter-spacing:.2px;white-space:nowrap}
  .platform-tag.win{background:#E9F0FF;color:var(--blue-600)}
  .platform-tag.mac{background:#F0ECFB;color:#6B43C7}
  .diff-card{display:flex;flex-direction:column;gap:13px;margin-top:2px}
  .diff{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:linear-gradient(180deg,#fff,#FAFCFF)}
  .diff .h{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:730;margin-bottom:10px;color:var(--ink-2)}
  .diff .row{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);margin-top:6px}
  .diff .row:first-of-type{margin-top:0}
  .diff .row .mono{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}

  .split-note{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
  .split-note .pn{flex:1;min-width:200px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#FBFCFE}
  .split-note .pn .h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:730;margin-bottom:6px}
  .split-note .pn .b{font-size:12px;color:var(--muted);font-family:var(--mono);word-break:break-all}

  /* ================= Install ================= */
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
  .progress-top .pct{font-size:28px;font-weight:820;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
  .progress-top .stat{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
  .pbar{height:13px;border-radius:9px;background:var(--line);overflow:hidden;position:relative;box-shadow:inset 0 1px 2px rgba(30,58,110,.07)}
  .pbar i{display:block;height:100%;width:67%;border-radius:9px;background:linear-gradient(90deg,#5B9BFF,var(--blue));box-shadow:0 0 12px rgba(37,99,235,.5)}
  .pbar i::after{content:"";position:absolute;inset:0 0 auto 0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent);border-radius:9px 9px 0 0}
  .install-meta{display:flex;gap:22px;margin-top:13px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
  .install-meta b{color:var(--ink)}
  .log{
    margin-top:18px;background:linear-gradient(180deg,#0F1A2E,#0B1422);border-radius:14px;padding:16px 18px;font-family:var(--mono);font-size:12.5px;line-height:1.95;
    border:1px solid #1E2B45;box-shadow:inset 0 1px 0 rgba(255,255,255,.05), var(--sh-2)
  }
  .log .ln{display:flex;gap:11px;color:#A6B7D1}
  .log .ln .t{color:#5E7195;flex:none}
  .log .ok{color:#3BD786;flex:none}
  .log .arrow{color:#7FA6FF;flex:none}
  .log .run{color:#FBBF24;flex:none}

  .foot{margin-top:48px;text-align:center;color:var(--faint);font-size:12.5px}
  .foot b{color:var(--muted);font-weight:650}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== Page header ===== -->
  <div class="page-head">
    <div class="brand">
      <div class="logo">
        <svg width="29" height="29" viewBox="0 0 24 24" fill="none"><path d="M12 2.4l7.6 4.1v6c0 4.7-3.3 7.9-7.6 9.1-4.3-1.2-7.6-4.4-7.6-9.1v-6L12 2.4z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.3 12.2l2.6 2.6 4.7-5.1" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

            <div class="row"><span class="platform-tag win">Windows</span> <span class="mono">Startup · clod-helper.vbs</span></div>

          <div class="diff">

            <div class="row"><span class="platform-tag win">Windows</span> Правило Windows Firewall</div>

    <!-- ===== 6. INSTALL ===== -->
    <div class="section-label"><span class="n">6</span><h2>Установка</h2><span class="line"></span></div>

    <div class="col-12">

        <p class="sub">Скачиваем и настраиваем — это займёт пару минут. Закрывать окно не нужно.</p>

        <div class="progress-top">

        <div class="log">
          <div class="ln"><span class="t">12:04:21</span><span class="ok">✓</span><span>Node.js 20.11 установлен</span></div>
          <div class="ln"><span class="t">12:04:48</span><span class="ok">✓</span><span>Прокси проверен — SOCKS5, задержка 42 мс</span></div>

  <script type="text/html" id="v3"><!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clod Helper — Nord Frost</title>
<style>
  :root{
    /* base palette */
    --bg:#2E3440;
    --bg-deep:#272c36;
    --bg-deepest:#22262e;
    --panel:#3B4252;
    --panel-2:#434C5E;
    --panel-3:#4C566A;
    --line:#4C566A;
    --line-soft:#3f4858;
    --line-hair:#363e4c;
    --text:#ECEFF4;
    --text-2:#D8DEE9;
    --muted:#9aa6ba;
    --muted-2:#7f8aa0;
    /* frost accents */
    --frost:#88C0D0;
    --frost-2:#81A1C1;
    --frost-3:#5E81AC;
    /* status */
    --ok:#A3BE8C;
    --warn:#EBCB8B;
    --err:#BF616A;
    /* radii scale */
    --r-lg:16px;
    --r-md:12px;
    --r-sm:10px;
    --r-xs:8px;
    --r-pill:999px;
    /* shadow scale */
    --sh-1:0 1px 0 rgba(255,255,255,.04) inset, 0 8px 22px rgba(0,0,0,.16);
    --sh-2:0 1px 0 rgba(255,255,255,.04) inset, 0 16px 38px rgba(0,0,0,.22);
    --sh-win:0 1px 0 rgba(255,255,255,.05) inset, 0 34px 80px rgba(0,0,0,.48);
    --mono:ui-monospace,'JetBrains Mono','SF Mono',Consolas,monospace;
    --sans:-apple-system,'Segoe UI',Inter,Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1100px 560px at 50% -8%, rgba(136,192,208,.10) 0%, rgba(52,60,74,0) 55%),
      radial-gradient(900px 500px at 92% 8%, rgba(94,129,172,.10) 0%, rgba(52,60,74,0) 50%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    line-height:1.45;
    padding:48px 24px 72px;
  }
  .wrap{max-width:1180px;margin:0 auto}
  ::selection{background:rgba(136,192,208,.3)}

  /* ---------- page header ---------- */
  .page-head{display:flex;align-items:center;gap:18px;margin-bottom:40px}
  .logo{
    width:56px;height:56px;border-radius:var(--r-lg);flex:none;position:relative;
    background:linear-gradient(150deg,var(--frost) 0%,var(--frost-3) 100%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 28px rgba(94,129,172,.4), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .logo::after{content:"";position:absolute;inset:0;border-radius:var(--r-lg);
    border:1px solid rgba(236,239,244,.18);pointer-events:none}
  .logo svg{width:30px;height:30px}
  .page-head .ht h1{font-size:27px;margin:0;letter-spacing:.2px;font-weight:700}
  .page-head .ht p{margin:4px 0 0;color:var(--muted);font-size:14px}
  .os-switch{margin-left:auto;display:flex;background:var(--panel);border:1px solid var(--line-soft);
    border-radius:var(--r-pill);padding:4px;gap:2px;box-shadow:var(--sh-1)}
  .os-switch button{border:0;background:transparent;color:var(--text-2);font:inherit;font-size:13px;font-weight:500;
    padding:9px 18px;border-radius:var(--r-pill);cursor:default;display:flex;align-items:center;gap:8px}
  .os-switch button.active{background:var(--panel-3);color:var(--text);
    box-shadow:0 1px 0 rgba(255,255,255,.07) inset, 0 2px 6px rgba(0,0,0,.2)}

  /* ---------- section eyebrow ---------- */
  .eyebrow{display:flex;align-items:center;gap:12px;margin:40px 0 18px}
  .eyebrow .n{width:24px;height:24px;border-radius:var(--r-xs);flex:none;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:var(--frost);background:rgba(136,192,208,.12);border:1px solid rgba(136,192,208,.28)}
  .eyebrow h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-2)}
  .eyebrow .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--line-soft),transparent)}
  .eyebrow .meta{font-size:11.5px;color:var(--muted-2);letter-spacing:.3px}

  /* ---------- layout grid ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .span-2{grid-column:1 / -1}

  /* ---------- generic card ---------- */
  .card{
    background:var(--panel);
    border:1px solid var(--line-soft);
    border-radius:var(--r-lg);
    box-shadow:var(--sh-2);
    overflow:hidden;
  }
  .card-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-soft);
    background:linear-gradient(180deg,rgba(255,255,255,.018),transparent)}
  .card-h .ix{width:28px;height:28px;border-radius:var(--r-xs);background:rgba(136,192,208,.10);
    border:1px solid rgba(136,192,208,.22);display:flex;align-items:center;justify-content:center;color:var(--frost);flex:none}
  .card-h .ix svg{width:15px;height:15px}
  .card-h h2{font-size:14.5px;margin:0;font-weight:600;letter-spacing:.2px}
  .card-h .tag{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--muted);background:var(--panel-2);
    border:1px solid var(--line-soft);padding:4px 10px;border-radius:var(--r-pill);letter-spacing:.5px}
  .card-b{padding:20px}

  /* ---------- window chrome (app frame) ---------- */
  .appwin{background:var(--bg-deep);border:1px solid #20242c;border-radius:var(--r-lg);overflow:hidden;
    box-shadow:var(--sh-win)}
  .titlebar{display:flex;align-items:center;gap:14px;padding:13px 16px;
    background:linear-gradient(180deg,#363d4a,#30363f);border-bottom:1px solid #20242c}
  .lights{display:flex;gap:8px}
  .lights i{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25)}
  .l-r{background:#BF616A}.l-y{background:#EBCB8B}.l-g{background:#A3BE8C}
  .win-title{font-size:12.5px;color:var(--text-2);font-weight:500;letter-spacing:.2px}
  .win-title b{color:var(--frost);font-weight:600}
  .win-ctrls{margin-left:auto;display:flex;gap:14px;color:var(--muted)}
  .win-ctrls svg{width:14px;height:14px;display:block}
  .win-note{margin-left:auto;font-size:11px;color:var(--muted-2);border:1px dashed var(--line);
    padding:3px 9px;border-radius:var(--r-xs);letter-spacing:.2px}

  /* windows variant titlebar */
  .titlebar.win{justify-content:flex-start;padding:0 0 0 14px}
  .titlebar.win .win-ico{width:18px;height:18px;border-radius:5px;
    background:linear-gradient(150deg,var(--frost),var(--frost-3));flex:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
  .titlebar.win .win-title{margin-right:14px}
  .titlebar.win .winbtns{margin-left:auto;display:flex;gap:0;align-self:stretch}
  .titlebar.win .winbtns span{width:46px;display:flex;align-items:center;justify-content:center;
    color:var(--text-2);font-size:13px}
  .titlebar.win .winbtns span.close-hover{background:var(--err);color:#fff}

  /* ---------- wizard / proxy step ---------- */
  .steps{display:flex;gap:6px;align-items:center;margin-bottom:24px;flex-wrap:wrap}
  .step{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12.5px;font-weight:500}
  .step .dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--panel-2);border:1px solid var(--line);font-size:12px;font-weight:700}
  .step.done .dot{background:rgba(163,190,140,.16);border-color:rgba(163,190,140,.55);color:var(--ok)}
  .step.active{color:var(--text)}
  .step.active .dot{background:rgba(136,192,208,.18);border-color:var(--frost);color:var(--frost);
    box-shadow:0 0 0 4px rgba(136,192,208,.10)}
  .step-sep{width:32px;height:2px;border-radius:2px;background:var(--line-soft)}
  .step-sep.pass{background:linear-gradient(90deg,rgba(163,190,140,.6),var(--frost))}

  label.fl{display:flex;align-items:center;font-size:12px;color:var(--text-2);margin:0 0 8px;letter-spacing:.2px;font-weight:500}
  .field{display:flex;align-items:center;gap:10px;background:var(--bg-deep);border:1px solid var(--line);
    border-radius:var(--r-sm);padding:0 14px;height:50px;transition:border-color .15s, box-shadow .15s}
  .field:focus-within,.field.focus{border-color:var(--frost);box-shadow:0 0 0 3px rgba(136,192,208,.16)}
  .field .pfx{color:var(--frost-2);display:flex}
  .field input,.field .val{flex:1;background:transparent;border:0;outline:0;color:var(--text);font-family:var(--mono);
    font-size:13px;letter-spacing:.2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .field .auto-badge{font-family:var(--sans);font-size:10.5px;font-weight:700;
    color:var(--bg-deep);background:var(--frost);padding:4px 10px;border-radius:var(--r-xs);letter-spacing:.6px;flex:none}

  .hint{font-size:12px;color:var(--muted);margin:12px 2px 0;line-height:1.6}
  .hint b{color:var(--text-2);font-weight:600}
  .hint code{font-family:var(--mono);font-size:11.5px;color:var(--frost-2);background:rgba(94,129,172,.12);
    padding:1px 6px;border-radius:5px}

  /* live check result */
  .check{margin-top:8px;background:var(--bg-deep);border:1px solid var(--line-soft);border-radius:var(--r-sm);
    padding:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px 14px}
  .check .c{display:flex;flex-direction:column;gap:6px;min-width:0}
  .check .lbl{font-size:10.5px;color:var(--muted-2);letter-spacing:.5px;text-transform:uppercase;font-weight:600}
  .check .v{font-size:14px;color:var(--text);font-weight:600;display:flex;align-items:center;gap:7px}
  .check .v.mono{font-family:var(--mono);font-size:13px;font-weight:500}
  .pill-ok{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-size:11.5px;font-weight:600;
    background:rgba(163,190,140,.12);border:1px solid rgba(163,190,140,.3);padding:3px 10px;border-radius:var(--r-pill)}
  .pill-ok .d{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px rgba(163,190,140,.8)}

  .row-actions{display:flex;align-items:center;gap:12px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line-hair)}
  .spacer{flex:1}

  /* buttons */
  .btn{border:1px solid var(--line);background:var(--panel-2);color:var(--text);font:inherit;font-size:13.5px;
    font-weight:600;padding:11px 18px;border-radius:var(--r-sm);cursor:default;display:inline-flex;align-items:center;gap:8px;
    transition:filter .15s}
  .btn svg{width:15px;height:15px}
  .btn.ghost{background:transparent}
  .btn.frost{background:linear-gradient(150deg,var(--frost),var(--frost-2));border-color:transparent;color:#1f2a30;
    box-shadow:0 8px 20px rgba(136,192,208,.22)}
  .btn.primary{background:linear-gradient(150deg,var(--ok),#94b07d);border-color:transparent;color:#243018;
    box-shadow:0 8px 20px rgba(163,190,140,.25)}
  .btn.danger{background:transparent;border-color:rgba(191,97,106,.5);color:var(--err)}
  .btn.sm{padding:8px 13px;font-size:12.5px}

  /* ---------- dashboard ---------- */
  .dash-hero{display:flex;align-items:center;gap:18px;padding:20px;position:relative;overflow:hidden;
    background:linear-gradient(120deg, rgba(163,190,140,.12), rgba(136,192,208,.05) 60%, transparent);
    border:1px solid var(--line-soft);border-left:3px solid var(--ok);border-radius:var(--r-sm);margin-bottom:18px}
  .statusring{width:64px;height:64px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%, rgba(163,190,140,.35), rgba(163,190,140,.04));
    border:2px solid rgba(163,190,140,.5);box-shadow:0 0 24px rgba(163,190,140,.18)}
  .statusring .core{width:22px;height:22px;border-radius:50%;background:var(--ok);box-shadow:0 0 16px rgba(163,190,140,.95)}
  .dash-hero .big{font-size:24px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
  .dash-hero .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .dash-hero .uptime{margin-left:auto;text-align:right}
  .dash-hero .uptime .t{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
  .dash-hero .uptime .l{font-size:10.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}

  .kv{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .kv .item{background:var(--bg-deep);border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:14px 16px}
  .kv .k{font-size:10.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.5px;font-weight:600;display:flex;align-items:center;gap:7px}
  .kv .k svg{color:var(--frost-2)}
  .kv .val{margin-top:8px;font-family:var(--mono);font-size:13.5px;color:var(--text);word-break:break-all}
  .kv .val.plain{font-family:var(--sans);font-size:14px;font-weight:600;display:flex;align-items:center;gap:9px}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:var(--r-xs);letter-spacing:.3px}
  .badge.proto{background:rgba(136,192,208,.16);color:var(--frost);border:1px solid rgba(136,192,208,.32)}
  .badge.health{background:rgba(163,190,140,.16);color:var(--ok);border:1px solid rgba(163,190,140,.32)}
  .badge.mute{background:var(--panel);color:var(--muted-2);border:1px solid var(--line)}
  .health-bars{display:inline-flex;gap:3px;align-items:flex-end;height:14px;margin-left:2px}
  .health-bars i{width:3px;border-radius:2px;background:var(--ok)}
  .health-bars i:nth-child(1){height:5px}.health-bars i:nth-child(2){height:8px}
  .health-bars i:nth-child(3){height:11px}.health-bars i:nth-child(4){height:14px}

  .dash-actions{display:flex;gap:10px;margin-top:18px}

  /* ---------- settings ---------- */
  .sect{padding:18px 0;border-bottom:1px solid var(--line-hair)}
  .sect:first-child{padding-top:0}
  .sect:last-child{border-bottom:0;padding-bottom:0}
  .sect-t{font-size:12.5px;font-weight:700;color:var(--text);margin:0 0 14px;display:flex;align-items:center;gap:9px;letter-spacing:.3px;text-transform:uppercase}
  .sect-t .si{color:var(--frost);display:flex}
  .sect-t .si svg{width:15px;height:15px;display:block}

  .toggle-row{display:flex;align-items:center;gap:14px;padding:10px 0}
  .toggle-row .tx{flex:1}
  .toggle-row .tt{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
  .toggle-row .td{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
  .winonly{font-size:10px;font-weight:700;color:var(--frost-2);background:rgba(129,161,193,.14);

  .sw{width:46px;height:26px;border-radius:var(--r-pill);background:var(--panel-3);border:1px solid var(--line);position:relative;flex:none}

  .sw.on i{left:22px;background:var(--frost)}

  .update-bar{display:flex;align-items:center;gap:14px;background:rgba(235,203,139,.10);
    border:1px solid rgba(235,203,139,.35);border-left:3px solid var(--warn);border-radius:var(--r-sm);padding:13px 16px;margin-top:12px}
  .update-bar .ui{width:34px;height:34px;border-radius:var(--r-xs);background:rgba(235,203,139,.18);color:var(--warn);

  .update-bar .ut{flex:1}
  .update-bar .ut b{font-size:13.5px;color:var(--text)}
  .update-bar .ut span{display:block;font-size:12px;color:var(--muted);margin-top:2px}

  .check-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .cl-row{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:var(--r-sm);background:var(--bg-deep);border:1px solid var(--line-soft)}
  .cb{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;background:var(--bg-deepest)}

<html lang="ru">
<head>

  *{box-sizing:border-box}

      radial-gradient(circle at 16% 6%, rgba(203,75,22,.055), transparent 40%),

  .b-olive{color:#fff;background:linear-gradient(150deg,#7C8A35,#6E7B2E);box-shadow:0 3px 8px rgba(110,123,46,.28)}
  .b-amber{color:var(--amber-deep);background:rgba(207,153,28,.14);border:1px solid rgba(207,153,28,.3)}
  .b-pumpkin{color:#fff;background:linear-gradient(150deg,#CB4B16,#E8703E);box-shadow:0 3px 8px rgba(203,75,22,.28)}
  .ch .badge{margin-left:auto}

  /* steps */
  .steps{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-faint);margin-bottom:24px}
  .steps .s{display:flex;align-items:center;gap:8px}
  .steps .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:11px;background:var(--card-3);border:1px solid var(--line);color:var(--ink-soft)}
  .steps .s.done .num{background:linear-gradient(150deg,#7C8A35,#6E7B2E);border-color:transparent;color:#fff}
  .steps .s.done span{color:var(--ink-soft)}
  .steps .s.now .num{background:linear-gradient(150deg,#CB4B16,#E8703E);border-color:transparent;color:#fff;box-shadow:var(--ring-pumpkin)}
  .steps .s.now span{color:var(--ink);font-weight:700}
  .steps .bar{flex:1;height:2px;background:var(--line);border-radius:2px;min-width:16px}
  .steps .bar.fill{background:linear-gradient(90deg,#7C8A35,#6E7B2E)}

  label.lbl{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:0 0 8px}
  .field{
    display:flex;align-items:center;gap:10px;background:var(--card-2);border:1.5px solid var(--line);
    border-radius:var(--r-md);padding:12px 14px;font-family:var(--mono);font-size:13px;color:var(--ink);
  }
  .field.focus{border-color:var(--pumpkin);box-shadow:var(--ring-pumpkin);background:#fff}
  .field svg{width:16px;height:16px;color:var(--ink-faint);flex:none}
  .field .pw{color:var(--pumpkin);font-weight:600}
  .hinttext{font-size:11.5px;color:var(--ink-faint);margin-top:8px;line-height:1.6}
  .hinttext b{color:var(--ink-soft)}

  /* live check panel */
  .check{
    margin-top:18px;background:linear-gradient(180deg,#FFFDF6,#FCF4E4);border:1px solid var(--line);
    border-radius:var(--r-md);padding:16px 18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)
  }
  .check .top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .check .top .ok{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--green)}
  .check .top .ok .tick{width:18px;height:18px;border-radius:50%;background:var(--green);display:grid;place-items:center;flex:none}
  .check .top .ok .tick svg{width:11px;height:11px;color:#fff;stroke-width:3.2}
  .kv{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 22px}
  .kv .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);margin-bottom:3px}
  .kv .v{font-size:13.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px}
  .kv .v.mono{font-family:var(--mono);font-size:12.5px;font-weight:500}
  .ping b{color:var(--green)}
  .bars{display:inline-flex;gap:2px;align-items:flex-end;height:13px}
  .bars i{width:3px;background:var(--green-ind);border-radius:1px}
  .bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8px}.bars i:nth-child(3){height:11px}.bars i:nth-child(4){height:13px;opacity:.32}

  /* buttons */
  .btn{font-family:var(--sans);font-weight:600;font-size:13.5px;border-radius:var(--r-md);padding:11px 20px;border:1.5px solid transparent;cursor:default;display:inline-flex;align-items:center;gap:8px;line-height:1}
  .btn svg{width:15px;height:15px}
  .btn-primary{background:linear-gradient(150deg,#CB4B16,#E8703E);color:#fff;box-shadow:0 8px 18px rgba(203,75,22,.30), inset 0 1px 0 rgba(255,255,255,.32)}
  .btn-ghost{background:var(--card-2);color:var(--ink);border-color:var(--line)}
  .btn-olive{background:linear-gradient(150deg,#7C8A35,#6E7B2E);color:#fff;box-shadow:0 7px 15px rgba(110,123,46,.28)}
  .btn-danger{background:#fff;color:var(--red);border-color:rgba(192,67,42,.32)}
  .btn-row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  .btn-row.end{justify-content:flex-end}

  /* side card (install list / what installs) */
  .sidecard{box-shadow:var(--sh-sm)}
  .ilist .it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
  .ilist .it:last-child{border-bottom:none}
  .ilist .it .nm{font-weight:600;font-size:13.5px}
  .ilist .it .ds{font-size:11.5px;color:var(--ink-faint)}

  /* ---------- dashboard ---------- */
  .dash-hero{
    display:flex;align-items:center;gap:22px;padding:24px;
    background:linear-gradient(135deg,#FFFDF6,#FBF1DC);border:1px solid var(--line);border-radius:var(--r-lg);
    box-shadow:var(--sh-sm);position:relative;overflow:hidden
  }
  .dash-hero::after{content:"";position:absolute;right:-44px;top:-44px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(94,140,62,.14),transparent 70%)}
  .pulse{width:64px;height:64px;border-radius:50%;flex:none;background:radial-gradient(circle at 38% 34%,#8ECC60,#5E8C3E);box-shadow:0 0 0 6px rgba(111,174,61,.16),0 0 0 13px rgba(111,174,61,.08),0 6px 14px rgba(94,140,62,.38);position:relative}
  .pulse::after{content:"";position:absolute;inset:18px;border-radius:50%;background:#fff;opacity:.9;-webkit-mask:radial-gradient(circle at 60% 40%,#000 40%,transparent 41%);mask:radial-gradient(circle at 60% 40%,#000 40%,transparent 41%)}
  .dash-hero .st{z-index:1}
  .dash-hero .st .lab{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-faint)}
  .dash-hero .st .big{font-family:var(--serif);font-size:31px;line-height:1.05;color:var(--green);margin:3px 0 5px;font-weight:600}
  .dash-hero .st .up{font-size:13px;color:var(--ink-soft)}
  .dash-hero .st .up b{color:var(--ink);font-weight:600}
  .dash-hero .right{margin-left:auto;text-align:right;z-index:1;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  .dash-hero .right .hl{font-size:12px;color:var(--green);font-weight:600;display:flex;align-items:center;gap:6px}

  .conn{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
  .conn .cell{background:var(--card-2);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:14px 16px}
  .conn .cell .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);display:flex;align-items:center;gap:6px;margin-bottom:7px}
  .conn .cell .k svg{width:13px;height:13px}
  .conn .cell .v{font-family:var(--mono);font-size:13px;color:var(--ink);word-break:break-all;font-weight:500}
  .conn .cell .v .pw{color:var(--pumpkin);font-weight:600}
  .metric{display:flex;gap:14px;align-items:baseline}
  .metric .num{font-family:var(--serif);font-size:22px;color:var(--ink);font-weight:600}
  .metric .ok{font-size:12px;font-weight:700;color:var(--green);display:flex;align-items:center;gap:6px}

  /* ---------- settings ---------- */
  .set-block{padding:18px 0;border-bottom:1px solid var(--line-soft)}
  .set-block:last-child{border-bottom:none;padding-bottom:2px}
  .set-block:first-child{padding-top:4px}
  .set-head{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .set-head .si{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;background:rgba(110,123,46,.1);color:var(--olive)}
  .set-head .si svg{width:15px;height:15px}
  .set-head h4{font-family:var(--serif);font-size:15.5px;margin:0;font-weight:600}
  .set-head .os-only{margin-left:8px;font-size:10px;font-weight:700;color:var(--pumpkin);background:rgba(203,75,22,.10);border:1px solid rgba(203,75,22,.2);padding:2px 8px;border-radius:6px;letter-spacing:.3px}

  .update-pill{display:flex;align-items:center;gap:13px;background:linear-gradient(120deg,rgba(110,123,46,.11),rgba(110,123,46,.045));border:1px solid rgba(110,123,46,.28);border-radius:var(--r-md);padding:13px 15px;margin-top:12px}
  .update-pill .txt{font-size:13px;color:var(--ink);font-weight:600}
  .update-pill .txt span{color:var(--ink-soft);font-weight:400}
  .update-pill .btn{margin-left:auto;padding:8px 16px;font-size:12.5px}

  /* checklist (uninstall) */
  .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);background:#fff;flex:none;display:grid;place-items:center}
  .box svg{width:12px;height:12px;color:#fff}
  .box.on{background:linear-gradient(150deg,#CB4B16,#E8703E);border-color:transparent}
  .box.olive.on{background:linear-gradient(150deg,#7C8A35,#6E7B2E)}
  .checklist{margin-top:6px}
  .ck{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card-2);margin-bottom:9px}
  .ck:last-child{margin-bottom:0}
  .ck .nm{font-size:13.5px;font-weight:600;color:var(--ink)}
  .ck .ds{font-size:11.5px;color:var(--ink-faint)}
  .ck .off-tag{margin-left:auto;font-size:10px;font-weight:700;color:var(--ink-faint);background:var(--line-soft);padding:3px 9px;border-radius:6px;letter-spacing:.3px}

  /* toggles */
  .togrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line-soft)}
  .togrow:first-of-type{border-top:none}
  .togrow .ti{flex:1}
  .togrow .ti .t{font-size:13.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px}
  .togrow .ti .t svg{width:16px;height:16px;color:var(--olive)}
  .togrow .ti .d{font-size:11.5px;color:var(--ink-faint);margin-top:3px}
  .winonly{font-size:10px;font-weight:700;color:var(--pumpkin);background:rgba(203,75,22,.10);border:1px solid rgba(203,75,22,.2);padding:1px 7px;border-radius:6px;letter-spacing:.3px}
  .toggle{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22)}
  .toggle.on{background:linear-gradient(150deg,#7C8A35,#6E7B2E)}
  .toggle.on::after{left:21px}

  /* ---------- tray / menubar ---------- */
  .tray-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .traycard{background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-xs)}
  .traycard .os-cap{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:13px}
  .traycard .os-cap svg{width:15px;height:15px;color:var(--olive)}
  .menu{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-md);overflow:hidden}
  .menu .mhead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(180deg,#FFFDF6,#FCF4E4);border-bottom:1px solid var(--line-soft)}
  .menu .mhead .ind{width:10px;height:10px;border-radius:50%;flex:none}
  .menu .mhead .nm{font-size:12.5px;font-weight:700;color:var(--ink)}
  .menu .mhead .stt{margin-left:auto;font-size:11px;font-weight:700}
  .menu .mi{display:flex;align-items:center;gap:11px;padding:10px 14px;font-size:13px;color:var(--ink)}
  .menu .mi svg{width:15px;height:15px;color:var(--ink-soft);flex:none}
  .menu .mi.sep{border-top:1px solid var(--line-soft)}
  .menu .mi.hot{color:var(--pumpkin);font-weight:600}
  .menu .mi.hot svg{color:var(--pumpkin)}
  .menu .mi .sc{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-faint)}
  .ind.g{background:var(--green-ind);box-shadow:0 0 0 3px rgba(111,174,61,.2)}
  .ind.y{background:var(--amber);box-shadow:0 0 0 3px rgba(207,153,28,.22)}
  .ind.r{background:var(--red);box-shadow:0 0 0 3px rgba(192,67,42,.2)}
  .legend{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap}
  .legend .lg{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-soft)}
  .legend .lg i{width:9px;height:9px;border-radius:50%}

  /* ---------- install ---------- */
  .inst-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
  .inst-head .pct{font-family:var(--serif);font-size:32px;color:var(--pumpkin);line-height:1;font-weight:600}
  .inst-head .stage{font-size:13px;color:var(--ink-soft);font-weight:600}
  .pbar{height:12px;border-radius:999px;background:var(--line);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.07)}
  .pbar > i{display:block;height:100%;width:64%;border-radius:999px;background:linear-gradient(90deg,#CB4B16,#E8703E);box-shadow:0 1px 4px rgba(203,75,22,.4)}
  .inst-stats{display:flex;gap:24px;margin-top:13px;font-size:12.5px;color:var(--ink-soft);flex-wrap:wrap}
  .inst-stats b{color:var(--ink);font-family:var(--mono);font-size:12.5px}
  .logbox{margin-top:18px;background:#3A332B;border-radius:var(--r-md);padding:15px 17px;font-family:var(--mono);font-size:12px;line-height:1.9;box-shadow:inset 0 2px 8px rgba(0,0,0,.25)}
  .logbox .ln{color:#D8C9AE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .logbox .ln .t{color:#9A8C72}
  .logbox .ln .ok{color:#A6C76A;font-weight:700}
  .logbox .ln .w{color:#E8A24A}
  .logbox .ln.cur{color:#FBF3E2}
  .logbox .ln.cur::after{content:"▋";color:var(--pumpkin-soft);margin-left:1px}
  .qitem{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
  .qitem:last-child{border-bottom:none}
  .spin{width:18px;height:18px;border-radius:5px;border:2px solid var(--pumpkin);border-top-color:transparent;flex:none}

  /* ---------- success (готово) ---------- */
  .done-hero{text-align:center;padding:14px 8px 4px}
  .done-seal{width:78px;height:78px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;
    background:radial-gradient(circle at 38% 34%,#8ECC60,#5E8C3E);
    box-shadow:0 0 0 7px rgba(111,174,61,.14),0 0 0 15px rgba(111,174,61,.07),0 10px 22px rgba(94,140,62,.34)}
  .done-seal svg{width:38px;height:38px;color:#fff;stroke-width:3}
  .done-hero h3{font-family:var(--serif);font-size:24px;margin:0 0 6px;font-weight:600;color:var(--ink)}
  .done-hero p{font-size:13.5px;color:var(--ink-soft);max-width:440px;margin:0 auto}
  .done-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0 4px}
  .done-sum .ds-c{background:var(--card-2);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:14px;text-align:center}
  .done-sum .ds-c .ic{width:30px;height:30px;border-radius:8px;margin:0 auto 8px;display:grid;place-items:center;background:rgba(94,140,62,.12);color:var(--green)}
  .done-sum .ds-c .ic svg{width:16px;height:16px}
  .done-sum .ds-c .lab{font-size:11px;color:var(--ink-faint)}
  .done-sum .ds-c .val{font-size:13px;font-weight:700;color:var(--ink);margin-top:2px}

  .footer{margin-top:48px;text-align:center;font-size:12px;color:var(--ink-faint)}
  .footer .sep{margin:0 9px;color:var(--line)}

  @media(max-width:860px){
    .grid{grid-template-columns:1fr}
    .kv{grid-template-columns:1fr}
    .conn,.tray-grid,.done-sum{grid-template-columns:1fr}
    .winbody [style*="grid-template-columns"]{grid-template-columns:1fr !important}
  }
</style>
</head>

            <b class="close"><svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></b>
          </div>
        </div>

        <div class="winbody">

          <div style="display:grid;grid-template-columns:1.15fr 1fr;gap:28px">

                <span>http://<span class="pw">marina</span>:<span class="pw">••••••••</span>@45.130.61.5:8000</span>

              <div class="check">
                <div class="top">
                  <span class="ok">
                    <span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6 9 17l-5-5"/></svg></span>
                    Прокси работает
                  </span>

  .tray .th{display:flex;align-items:center;gap:var(--s3);padding:11px var(--s4);border-bottom:1px solid var(--line-soft);background:linear-gradient(180deg,#170323,transparent)}
  .tray .th .os{margin-left:auto;font-family:var(--display);font-size:10px;color:var(--ink-mute);letter-spacing:.12em;text-transform:uppercase}
  .stat-led{width:10px;height:10px;border-radius:50%}
  .led-g{background:var(--green);box-shadow:0 0 12px var(--green)}
  .led-y{background:var(--amber);box-shadow:0 0 12px var(--amber)}
  .led-r{background:var(--red);box-shadow:0 0 12px var(--red)}
  .tray .sl{font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:12px;color:var(--ink-dim)}
  .menu{padding:var(--s2)}
  .mi{display:flex;align-items:center;gap:var(--s3);padding:9px 12px;border-radius:var(--r-sm);font-size:13px;color:var(--ink)}
  .mi.hl{background:linear-gradient(90deg,rgba(255,43,214,.18),transparent)}
  .mi .ic{color:var(--cyan);width:16px;text-align:center}
  .mi .kbd{margin-left:auto;font-size:10px;color:var(--ink-mute);letter-spacing:.06em}
  .mi.sep{border-top:1px dashed rgba(255,43,214,.18);margin:var(--s1) 6px;padding:0;height:0}
  .mi.quit{color:var(--red)} .mi.quit .ic{color:var(--red)}

  /* install */
  .progress-wrap{margin-top:var(--s1)}
  .pbar{height:16px;border-radius:9px;background:#0a0011;border:1px solid var(--line-cyan);overflow:hidden;position:relative;box-shadow:inset 0 0 14px rgba(0,229,255,.1)}
  .pbar > i{display:block;height:100%;width:64%;
    background:linear-gradient(90deg,var(--magenta),var(--cyan));
    box-shadow:0 0 18px rgba(255,43,214,.6);position:relative}
  .pbar > i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 8px,transparent 8px 16px)}
  .pmeta{display:flex;justify-content:space-between;margin-top:var(--s2);font-size:11px;color:var(--ink-dim);letter-spacing:.04em}
  .pmeta b{color:var(--cyan)}
  .inst-steps{display:flex;flex-direction:column;gap:6px;margin:var(--s4) 0 0}
  .is{display:flex;align-items:center;gap:var(--s2);font-size:12px;color:var(--ink-dim)}
  .is .mk{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;font-size:10px;flex:none;border:1px solid var(--line-soft);background:rgba(0,0,0,.3)}
  .is.done .mk{color:#02100b;background:var(--green);border-color:var(--green);box-shadow:var(--glow-green)}
  .is.now{color:#fff} .is.now .mk{color:#1a0014;background:var(--cyan);border-color:var(--cyan);box-shadow:var(--glow-cy)}
  .log{margin-top:var(--s4);border:1px solid var(--line);border-radius:var(--r-lg);background:#06000c;padding:var(--s3) var(--s4);font-size:12px;line-height:1.85;box-shadow:inset 0 0 26px rgba(255,43,214,.05)}
  .log .ln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .log .t{color:var(--ink-mute)}
  .log .ok{color:var(--green)}
  .log .info{color:var(--cyan)}
  .log .run{color:var(--magenta)}
  .log .cursor{color:var(--cyan);text-shadow:0 0 6px var(--cyan)}

  /* done / completion */
  .done-hero{display:flex;align-items:center;gap:var(--s5);flex-wrap:wrap}
  .seal{width:78px;height:78px;border-radius:20px;flex:none;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 40%,rgba(57,255,20,.3),rgba(57,255,20,.05));
    border:1px solid var(--green);box-shadow:0 0 28px rgba(57,255,20,.5),inset 0 0 18px rgba(57,255,20,.25);
    clip-path:polygon(12% 0,100% 0,100% 76%,88% 100%,0 100%,0 24%)}
  .done-hero h3{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.04em;margin:0 0 4px;color:#fff;text-shadow:0 0 16px rgba(57,255,20,.5)}
  .done-hero p{margin:0;color:var(--ink-dim);font-size:12px}
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin-top:var(--s5)}
  @media(max-width:560px){.summary{grid-template-columns:1fr}}
  .sum{border:1px solid var(--line-soft);border-radius:var(--r-md);padding:var(--s3);background:rgba(0,0,0,.25)}
  .sum .l{font-family:var(--display);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:4px}
  .sum .v{font-size:13px;color:var(--ink)} .sum .v b{color:var(--green)}

  .foot{margin-top:var(--s7);text-align:center;color:var(--ink-mute);font-family:var(--display);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
  .foot b{color:var(--magenta);text-shadow:0 0 8px rgba(255,43,214,.5)}
  .hl-cyan{color:var(--cyan)}
  .hl-mag{color:var(--magenta)}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="wrap">

  <!-- HEADER -->
  <div class="top">
    <div class="brand">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <path d="M12 2 3 7v10l9 5 9-5V7l-9-5z" stroke="#FF2BD6" stroke-width="1.4"/>

  <!-- ===== 1. WELCOME / FIRST RUN ===== -->

      <div class="win-os">
        <span class="chip cy">🍎 macOS</span>
        <span class="chip">⊞ Windows</span>
      </div>
    </div>
    <div class="p-body">
      <div class="steps">
        <div class="s act"><span class="n">1</span> Приветствие</div>
        <div class="sep"></div>
        <div class="s"><span class="n">2</span> Прокси</div>
        <div class="sep"></div>
        <div class="s"><span class="n">3</span> Установка</div>
        <div class="sep"></div>
        <div class="s"><span class="n">4</span> Готово</div>
      </div>
      <div class="welcome">
        <div class="art">
          <svg width="58" height="58" viewBox="0 0 24 24" fill="none">
            <path d="M12 2 3 7v10l9 5 9-5V7l-9-5z" stroke="#FF2BD6" stroke-width="1.2"/>
            <path d="M12 7l-4.5 2.5v5L12 17l4.5-2.5v-5L12 7z" stroke="#00E5FF" stroke-width="1.2"/>
            <circle cx="12" cy="12" r="1.8" fill="#39FF14"/>
          </svg>
        </div>
        <div class="txt">
          <h3>Добро пожаловать в Clod Helper</h3>

          <div class="feat">
            <span class="f"><span class="dt"></span> Автоопределение системы</span>
            <span class="f"><span class="dt"></span> SOCKS5 / HTTP</span>
            <span class="f"><span class="dt"></span> Локальный мост 127.0.0.1</span>
            <span class="f"><span class="dt"></span> Без ручной правки конфигов</span>
          </div>
        </div>
      </div>
      <div class="btns">
        <span class="chip cy">Обнаружена система: 🍎 macOS 14 Sonoma</span>
        <span class="btn-spacer"></span>
        <button class="btn ghost">Пропустить</button>
        <button class="btn primary">Начать настройку →</button>
      </div>
    </div>
  </section>

  <!-- ===== 2. PROXY WIZARD ===== -->
  <div class="cap"><span class="num">02</span><h2>Мастер прокси · живая проверка</h2><span class="rule"></span></div>
  <section class="panel span2 cy">
    <span class="corner tl"></span><span class="corner br"></span>
    <div class="winbar">

        <span class="chip">⊞ Windows</span>
      </div>
    </div>
    <div class="p-body">
      <div class="steps">
        <div class="s done"><span class="n">✓</span> Приветствие</div>
        <div class="sep"></div>
        <div class="s act"><span class="n">2</span> Прокси</div>
        <div class="sep"></div>
        <div class="s"><span class="n">3</span> Установка</div>
        <div class="sep"></div>
        <div class="s"><span class="n">4</span> Готово</div>
      </div>

      <div class="row" style="align-items:flex-end">
        <div style="flex:1;min-width:280px">
          <label class="fld">Адрес прокси (HTTP или SOCKS5)</label>
          <div class="input focus">
            <span style="color:var(--cyan)">🔗</span>
            <span class="ph">http://user47:••••••••@45.130.61.5:8000</span>
            <span class="cur"></span>
          </div>
        </div>
      </div>

      <!-- live check -->
      <div class="check">
        <span class="flag">🇩🇪</span>
        <div class="kv"><span class="k">Страна</span><span class="v">Германия</span></div>
        <div class="kv"><span class="k">IP-адрес</span><span class="v cyan">45.130.61.5</span></div>
        <div class="kv"><span class="k">Провайдер</span><span class="v">Hetzner GmbH</span></div>
        <div class="kv"><span class="k">Задержка</span><span class="v green">42 мс</span></div>
        <span class="badge">SOCKS5</span>
      </div>
      <div style="margin-top:var(--s3)"><span class="ok-tag">✦ Прокси отвечает · протокол определён автоматически · соединение зашифровано</span></div>

      <div class="btns">
        <button class="btn ghost">← Назад</button>

        <button class="btn primary">Дальше →</button>

  <!-- ===== 3. DASHBOARD + 4. INSTALL ===== -->

    <!-- DASHBOARD -->

        <div class="stat-grid">

            <div class="val"><b>127.0.0.1:8889</b></div>
          </div>
          <div class="stat cy">
            <div class="lbl">Upstream-прокси</div>
            <div class="val">http://user47:<span class="dots">••</span>@45.130.61.5:8000</div>
          </div>
          <div class="stat">
            <div class="lbl">Протокол</div>
            <div class="val"><b>SOCKS5</b> &nbsp;·&nbsp; HTTP резерв</div>
          </div>
          <div class="stat">
            <div class="lbl">Здоровье / задержка</div>

          </div>
          <div class="set-row">

              <div class="d">macOS: алиас в Dock · <span class="winonly">Windows: .lnk на рабочем столе</span></div>

  <!-- ===== 6. TRAY / MENUBAR ===== -->

          </div>

            <div class="mi"><span class="ic">✚</span> Восстановить</div>

  <script type="text/html" id="v6"><!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clod Helper — Aurora Glass</title>
<style>
  :root{
    /* glass fills */

    --glass-strong: rgba(255,255,255,.18);
    --glass-inset:  rgba(10,6,30,.42);
    /* hairlines */
    --border:       rgba(255,255,255,.22);
    --border-soft:  rgba(255,255,255,.13);
    /* text */
    --text:  #ffffff;
    --muted: rgba(255,255,255,.74);
    --faint: rgba(255,255,255,.50);
    /* status */
    --green:#34d399; --green-deep:#10b981; --green-ink:#053527;
    --amber:#fbbf24; --red:#fb7185; --cyan:#22d3ee; --violet:#a855f7;
    /* radius scale (8px rhythm) */
    --r-xl:24px; --r-lg:18px; --r-md:14px; --r-sm:11px; --r-xs:8px;
    /* shadow scale */
    --sh-card: 0 24px 60px rgba(18,8,55,.40), 0 2px 8px rgba(18,8,55,.20);
    --sh-pop:  0 30px 70px rgba(10,5,40,.55);
    --sh-soft: 0 12px 28px rgba(16,8,48,.30);
    --edge: inset 0 1px 0 rgba(255,255,255,.34);
    --mono: ui-monospace, 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    --sans: -apple-system, 'Segoe UI', Inter, Roboto, system-ui, sans-serif;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:var(--sans);
    color:var(--text);
    min-height:100vh;
    line-height:1.45;
    background:
      radial-gradient(1100px 720px at 6% -12%, rgba(168,85,247,.55), transparent 58%),
      radial-gradient(1000px 820px at 102% 2%, rgba(6,182,212,.52), transparent 54%),
      radial-gradient(1250px 980px at 50% 122%, rgba(79,70,229,.66), transparent 60%),
      linear-gradient(140deg,#4338CA 0%, #0EA5C0 48%, #9333EA 100%);
    background-attachment: fixed;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* aurora blobs */
  .blob{ position:fixed; border-radius:50%; filter:blur(96px); opacity:.55; z-index:0; pointer-events:none; }
  .b1{ width:540px; height:540px; left:-150px; top:90px;  background:#A855F7; }
  .b2{ width:480px; height:480px; right:-130px; top:300px; background:#06B6D4; }
  .b3{ width:640px; height:640px; left:28%; bottom:-300px; background:#4F46E5; }
  .b4{ width:320px; height:320px; right:16%; top:24px; background:#22d3ee; opacity:.42; }
  .grain{ position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.04;
    background-image:radial-gradient(rgba(255,255,255,.9) .5px, transparent .5px);
    background-size:3px 3px; }

  .wrap{ position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:48px 24px 96px; }

  /* ---------- masthead ---------- */
  .masthead{ display:flex; align-items:center; justify-content:space-between; gap:24px; margin-bottom:8px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:16px; }
  .logo{
    width:60px; height:60px; border-radius:18px; flex:none;
    background:linear-gradient(155deg, rgba(255,255,255,.34), rgba(255,255,255,.05));
    border:1px solid var(--border); backdrop-filter:blur(14px);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 12px 32px rgba(10,5,40,.42), var(--edge);
  }
  .brand h1{ font-size:26px; margin:0; letter-spacing:-.5px; font-weight:760; }
  .brand p{ margin:4px 0 0; color:var(--muted); font-size:13.5px; max-width:46ch; }
  .os-switch{
    display:inline-flex; padding:4px; gap:4px; border-radius:14px;
    background:var(--glass); border:1px solid var(--border-soft); backdrop-filter:blur(20px);
    box-shadow:var(--edge), var(--sh-soft);
  }
  .os-switch button{
    font-family:inherit; font-size:13px; font-weight:680; color:var(--muted);
    border:0; background:transparent; padding:9px 17px; border-radius:11px; cursor:default;
    display:flex; align-items:center; gap:8px; transition:.15s;
  }
  .os-switch button.active{
    color:#23106e; background:rgba(255,255,255,.94);
    box-shadow:0 8px 18px rgba(10,5,40,.32), inset 0 1px 0 rgba(255,255,255,.9);
  }
  .masthead .tagline{ width:100%; }
  .pill-stat{ display:inline-flex; align-items:center; gap:7px; font-size:11.5px; font-weight:650; color:var(--muted);
    background:var(--glass); border:1px solid var(--border-soft); padding:6px 12px; border-radius:999px; }

  /* ---------- glass card ---------- */
  .card{
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:var(--r-xl);
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    box-shadow:var(--sh-card), var(--edge);
    padding:24px;
    position:relative;
    overflow:hidden;
  }
  /* aurora-signature: refracted top sheen + corner glow */
  .card::before{ content:""; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    background:radial-gradient(120% 80% at 0% 0%, rgba(255,255,255,.10), transparent 42%); }
  .card::after{ content:""; position:absolute; top:0; left:18px; right:18px; height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.72), transparent); }

  .grid{ display:grid; gap:24px; }
  .g-2{ grid-template-columns:1fr 1fr; }
  .g-left{ grid-template-columns:5.4fr 6.6fr; }
  .g-7-5{ grid-template-columns:1.32fr 1fr; }
  @media (max-width:920px){ .g-2,.g-left,.g-7-5{ grid-template-columns:1fr; } }

  /* section labels */
  .sec-label{
    display:flex; align-items:center; gap:12px; margin:40px 2px 18px;
    font-size:12px; font-weight:760; letter-spacing:1.7px; text-transform:uppercase; color:rgba(255,255,255,.62);
  }
  .sec-label:first-of-type{ margin-top:34px; }
  .sec-label .num{
    width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg, rgba(255,255,255,.26), rgba(255,255,255,.06));
    border:1px solid var(--border); color:#fff; font-size:12.5px; letter-spacing:0; flex:none;
    box-shadow:var(--edge);
  }
  .sec-label .line{ flex:1; height:1px; background:linear-gradient(90deg, rgba(255,255,255,.28), transparent); }

  .card-title{ font-size:16px; font-weight:740; margin:0 0 5px; display:flex; align-items:center; gap:9px; letter-spacing:-.2px; }
  .card-sub{ font-size:12.5px; color:var(--muted); margin:0 0 18px; line-height:1.5; }

  /* ---------- window chrome ---------- */
  .window{ padding:0; }
  .titlebar{
    position:relative;
    display:flex; align-items:center; gap:12px; padding:14px 18px;
    background:rgba(255,255,255,.05); border-bottom:1px solid var(--border-soft);
  }
  .traffic{ display:flex; gap:8px; }
  .traffic i{ width:13px;height:13px;border-radius:50%; display:inline-block;
    box-shadow:inset 0 0 0 .5px rgba(0,0,0,.22), 0 1px 1px rgba(0,0,0,.15); }
  .traffic .r{ background:#ff5f57;} .traffic .y{ background:#febc2e;} .traffic .g{ background:#28c840;}
  .win-controls{ display:flex; gap:16px; color:var(--muted); margin-left:auto; }
  .win-controls span{ font-size:13px; line-height:1; }
  .titlebar .tt{ font-size:12.5px; color:var(--muted); font-weight:640; letter-spacing:.2px; }
  .titlebar .tt.center{ position:absolute; left:50%; transform:translateX(-50%); }

  /* stepper */
  .stepper{ display:flex; align-items:center; gap:8px; padding:20px 24px 4px; flex-wrap:wrap; }
  .step{ display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--faint); font-weight:600; }
  .step .dot{ width:25px;height:25px;border-radius:50%; display:flex;align-items:center;justify-content:center;

  .step .bar{ width:34px; height:2px; border-radius:2px; background:rgba(255,255,255,.16); }
  .step.done .bar{ background:rgba(52,211,153,.5); }

  /* ---------- forms ---------- */
  label.fld{ display:block; font-size:12.5px; color:var(--muted); margin:0 0 8px; font-weight:640; }
  .input{
    display:flex; align-items:center; gap:11px;
    background:rgba(8,5,26,.30); border:1px solid var(--border);
    border-radius:var(--r-md); padding:13px 15px; font-family:var(--mono); font-size:13.5px;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.22);
  }
  .input.focus{ border-color:rgba(255,255,255,.6); box-shadow:0 0 0 4px rgba(167,139,250,.28), inset 0 1px 3px rgba(0,0,0,.2); }
  .input input{ all:unset; flex:1; color:#fff; font-family:var(--mono); font-size:13.5px; min-width:0; }
  .input .key{ color:rgba(255,255,255,.42); font-family:var(--sans); font-size:12px; }

  /* live check row */
  .check{
    margin-top:14px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:rgba(255,255,255,.06); border:1px solid var(--border-soft);
    border-radius:var(--r-md); padding:14px 16px;
  }
  .flag{ font-size:27px; line-height:1; filter:drop-shadow(0 2px 4px rgba(0,0,0,.25)); }
