  .check .col b{ font-size:14px; font-family:var(--mono); }
  .check .col small{ color:var(--muted); font-size:11.5px; }
  .spacer{ flex:1; }
  .latency{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:680; color:#a7f3d0; }
  .pulse{ width:9px;height:9px;border-radius:50%; background:var(--green); box-shadow:0 0 0 4px rgba(52,211,153,.25), 0 0 10px var(--green); flex:none; }

  /* badges / chips */
  .badge{
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:740;
    padding:5px 11px; border-radius:999px; letter-spacing:.2px; white-space:nowrap;
    border:1px solid var(--border); background:var(--glass-strong); color:#fff;
  }
  .badge.ok{    background:rgba(52,211,153,.20); border-color:rgba(52,211,153,.55); color:#bff3dd; }
  .badge.proto{ background:rgba(34,211,238,.20); border-color:rgba(34,211,238,.5);  color:#c2f5fd; }
  .badge.amber{ background:rgba(251,191,36,.20); border-color:rgba(251,191,36,.5);  color:#fde68a; }
  .badge.red{   background:rgba(251,113,133,.22);border-color:rgba(251,113,133,.55);color:#fecdd3; }
  .badge.soft{  background:var(--glass); border-color:var(--border-soft); color:var(--muted); font-weight:640; }

  /* buttons */
  .btn{
    font-family:inherit; font-weight:720; font-size:13.5px; cursor:default;
    border-radius:var(--r-md); padding:12px 20px; border:1px solid var(--border);
    background:var(--glass-strong); color:#fff; display:inline-flex; align-items:center; gap:9px;

  .btn.ghost{ background:rgba(255,255,255,.05); }
  .btn.primary{
    background:linear-gradient(180deg,#3ee9ad,#10b981); border-color:rgba(16,185,129,.55); color:var(--green-ink);

  .btn.danger{ background:rgba(251,113,133,.16); border-color:rgba(251,113,133,.42); color:#fecdd3; }

  .row-actions{ display:flex; gap:12px; align-items:center; margin-top:20px; flex-wrap:wrap; }
  .hint{ font-size:12px; color:var(--muted); }

  /* ---------- dashboard ---------- */

    width:64px;height:64px;border-radius:50%; flex:none;

  /* settings */
  .set-block{ border-top:1px solid var(--border-soft); padding:20px 0; }

  .stage-cap{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin-bottom:10px; font-weight:640; }
  .menubar{ height:26px; border-radius:9px 9px 0 0; background:rgba(255,255,255,.10); border:1px solid var(--border-soft);

  .platform-note{
    display:flex; gap:11px; align-items:flex-start; margin-top:14px; padding:13px 15px;
    border-radius:var(--r-sm); background:rgba(255,255,255,.05); border:1px solid var(--border-soft);

  }
  .platform-note b{ color:#fff; }
  .platform-note.win{ border-color:rgba(99,179,237,.32); background:rgba(56,132,233,.10); }
  .platform-note.mac{ border-color:rgba(255,255,255,.16); }
  .ic-os{ font-size:15px; line-height:1.4; flex:none; }

  /* installer */
  .progress-num{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .progress-num .pct{ font-size:36px; font-weight:800; letter-spacing:-1.2px; }
  .progress-num .mb{ font-size:12.5px; color:var(--muted); font-family:var(--mono); }
  .track{ height:12px; border-radius:999px; background:rgba(8,5,26,.34); overflow:hidden; margin:14px 0 8px;
    border:1px solid var(--border-soft); box-shadow:inset 0 1px 3px rgba(0,0,0,.28); position:relative; }
  .fill{ height:100%; width:68%; border-radius:999px; position:relative;
    background:linear-gradient(90deg,#34d399, #22d3ee 55%, #a855f7);
    box-shadow:0 0 22px rgba(52,211,153,.5); }
  .fill::after{ content:""; position:absolute; inset:0 0 auto 0; height:50%; border-radius:999px 999px 40% 40%;
    background:linear-gradient(180deg, rgba(255,255,255,.45), transparent); }
  .meta-line{ display:flex; justify-content:space-between; gap:12px; font-size:11.5px; color:var(--muted); font-family:var(--mono); flex-wrap:wrap; }
  .log{
    margin-top:16px; background:rgba(8,5,26,.46); border:1px solid var(--border-soft);
    border-radius:var(--r-md); padding:15px 16px; font-family:var(--mono); font-size:12.5px; line-height:1.85;

  .log .ok{ color:#6ee7b7; } .log .info{ color:#a5b4fc; } .log .now{ color:#fff; font-weight:600; }
  .log .cursor{ display:inline-block; width:8px; height:14px; background:#fff; vertical-align:-2px; margin-left:2px;
    animation:none; opacity:.85; border-radius:1px; }

  .state-row{ display:flex; align-items:center; gap:12px; padding:13px 14px; margin-bottom:10px; border-radius:var(--r-sm);
    background:rgba(255,255,255,.05); border:1px solid var(--border-soft); }
  .state-row:last-child{ margin-bottom:0; }
  .state-row b{ font-size:13px; } .state-row .d{ color:var(--muted); font-size:11.5px; margin-top:2px; }

  .footer{ text-align:center; color:var(--faint); font-size:12px; margin-top:48px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .footer .dotsep{ opacity:.5; }

<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>

  <div class="wrap">

    <!-- ===== MASTHEAD ===== -->
    <div class="masthead">

            <path d="M12 2.5 4 6v6c0 4.5 3.2 7.8 8 9.5 4.8-1.7 8-5 8-9.5V6l-8-3.5Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" opacity=".95"/>
            <path d="m8.5 12 2.4 2.4L16 9.4" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>

        </div>
        <div>
          <h1>Clod Helper</h1>

    <!-- ===== 1+2. WINDOW + WIZARD (PROXY STEP) ===== -->

    <div class="card window">

        <div class="check">

            <small>Германия · Frankfurt · Deutsche Telekom AG</small>

    <!-- ===== 3. DASHBOARD + TRAY/MENUBAR PREVIEW ===== -->

    <div class="grid g-left">

        <div class="status-hero">

            <div class="v">http://user:••••••••@45.130.61.5:8000</div>
          </div>
          <div class="kv">
            <div class="k">Задержка</div>
            <div class="v big" style="color:#6ee7b7;">42 мс</div>
          </div>
          <div class="kv">
            <div class="k">Здоровье канала</div>

      <!-- tray / menubar live previews -->
      <div class="card">
        <h3 class="card-title">🟢 Меню в системном лотке</h3>

        <div class="menu-stage">

  <script type="text/html" id="v7"><!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clod Helper — Phosphor Terminal</title>
<style>
  :root{
    /* base */
    --bg:#000000;
    --bg-2:#010301;
    --panel:#020503;
    --panel-2:#030704;
    /* phosphor ramp */
    --phos:#39ff8a;
    --phos-bright:#7dffb6;
    --phos-dim:#19b86a;
    --phos-dimmer:#0e8a4f;
    --phos-faint:#0a4d2e;
    /* status */
    --amber:#ffb000;
    --amber-dim:#7a5500;
    --red:#ff4d4d;
    --red-dim:#7a2424;
    /* text */
    --txt:#a9ffd0;
    --txt-dim:#4f9e76;
    --txt-fade:#2f6e4d;
    /* lines */
    --line:#0c2c1d;
    --line-2:#103a25;
    --line-bright:#1a6440;
    --mono: ui-monospace,'JetBrains Mono','SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace;
    /* 4/8 spacing scale */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
    --glow-1:0 0 4px rgba(57,255,138,.55);
    --glow-2:0 0 4px rgba(57,255,138,.6), 0 0 12px rgba(57,255,138,.28);
    --glow-3:0 0 6px rgba(57,255,138,.7), 0 0 18px rgba(57,255,138,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    font-family:var(--mono);
    color:var(--phos);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    position:relative;
    min-height:100vh;
    padding:var(--s7) 0 64px;
    font-size:13px;
  }

  /* ===== CRT overlays: scanlines + aperture grille + vignette + bloom ===== */
  body::before{
    content:""; position:fixed; inset:0; z-index:9999; pointer-events:none;
    background:
      repeating-linear-gradient(to bottom,
        rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
        rgba(0,0,0,.30) 3px, rgba(0,0,0,.30) 4px),
      repeating-linear-gradient(to right,
        rgba(0,40,20,.05) 0px, rgba(0,40,20,.05) 1px,
        rgba(0,0,0,0) 1px, rgba(0,0,0,0) 3px);
    mix-blend-mode:multiply;
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:9998; pointer-events:none;
    background:
      radial-gradient(ellipse 120% 100% at 50% 50%, rgba(0,0,0,0) 52%, rgba(0,0,0,.62) 100%),
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(57,255,138,.05), rgba(0,0,0,0) 60%);
  }

  .wrap{ max-width:1180px; margin:0 auto; padding:0 var(--s5); }
  .glow{ text-shadow:var(--glow-2); }
  .glow-soft{ text-shadow:var(--glow-1); }
  a{color:inherit}

  /* ===================== MASTHEAD ===================== */
  .masthead{
    border:1px solid var(--line-2);
    background:
      linear-gradient(180deg, rgba(57,255,138,.05), rgba(0,0,0,0) 70%),
      var(--panel);
    padding:var(--s5) var(--s5) var(--s4);
    margin-bottom:var(--s5);
    position:relative; overflow:hidden;
    box-shadow:inset 0 0 40px rgba(57,255,138,.04);
  }
  .masthead::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(rgba(57,255,138,.02) 1px,transparent 1px) 0 0/100% 4px;
  }
  .mast-top{
    display:flex; align-items:center; justify-content:space-between; gap:var(--s4);
    margin-bottom:var(--s4); position:relative;
  }
  .logo{
    font-size:11px; letter-spacing:3px; color:var(--phos-dim);
    text-transform:uppercase;
  }
  .logo b{color:var(--phos); text-shadow:var(--glow-1)}
  .mast-meta{
    display:flex; gap:var(--s2); align-items:center; font-size:11px; color:var(--txt-fade);
  }
  .ascii-title{
    white-space:pre; font-size:11px; line-height:1.08; color:var(--phos);
    text-shadow:var(--glow-3); overflow-x:auto; position:relative;
    margin:0;
  }
  .mast-sub{
    margin-top:var(--s4); color:var(--txt-dim); font-size:12.5px; position:relative;
    display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap;
  }
  .mast-sub b{color:var(--phos); text-shadow:var(--glow-1)}

  /* ===================== SECTION LABEL ===================== */
  .seclabel{
    display:flex; align-items:center; gap:var(--s3);
    margin:var(--s6) 0 var(--s4); color:var(--phos-dim);
    font-size:12px; letter-spacing:2.5px; text-transform:uppercase;
  }
  .seclabel .num{
    border:1px solid var(--line-bright); padding:3px 10px; color:var(--phos);
    background:rgba(57,255,138,.06); text-shadow:var(--glow-1); font-weight:600;
  }
  .seclabel .ttl{color:var(--phos-bright); text-shadow:var(--glow-1)}
  .seclabel .rule{
    flex:1; height:1px;
    background:repeating-linear-gradient(to right,var(--line-bright) 0 7px, transparent 7px 14px);
    opacity:.7;
  }
  .seclabel .tag{
    font-size:10px; letter-spacing:1px; color:var(--phos-dimmer);
    border:1px solid var(--line); padding:2px 8px;
  }

  /* ===================== PANEL / WINDOW ===================== */
  .panel{
    border:1px solid var(--line-2);
    background:var(--panel);
    position:relative;
  }
  .panel-bg::before{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
    background:linear-gradient(rgba(57,255,138,.014) 1px,transparent 1px) 0 0/100% 4px;
  }
  .panel > *{position:relative; z-index:1}

  .winbar{
    display:flex; align-items:center; gap:var(--s3);
    padding:10px var(--s4); border-bottom:1px solid var(--line-2);
    background:linear-gradient(180deg, rgba(57,255,138,.08), rgba(57,255,138,.01));
    min-height:42px;
  }
  /* macOS traffic lights */
  .traffic{display:flex; gap:7px; align-items:center}
  .traffic i{
    width:11px;height:11px;border-radius:50%;display:block;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);
  }
  .traffic .r{background:#ff5f56}
  .traffic .y{background:#ffbd2e}
  .traffic .g{background:#27c93f}
  /* windows caption buttons */
  .wincaps{display:flex; gap:2px; align-items:center}
  .wincaps i{
    width:26px;height:18px;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line-2); color:var(--txt-dim); font-size:10px; line-height:1;
  }
  .wincaps i.x{color:#ff7a7a;border-color:var(--red-dim)}

  .wintitle{
    color:var(--phos-dim); font-size:12px; letter-spacing:1px;
    flex:1; display:flex; align-items:center; gap:var(--s2);
  }
  .wintitle.center{justify-content:center}
  .wintitle b{color:var(--phos); text-shadow:var(--glow-1)}
  .wintitle .ic{color:var(--phos-dim)}

  .os-toggle{
    display:inline-flex; border:1px solid var(--line-bright); font-size:11px;
    background:#000; overflow:hidden;
  }
  .os-toggle span{padding:4px 11px; color:var(--txt-fade); display:flex; align-items:center; gap:5px}
  .os-toggle span.on{
    background:rgba(57,255,138,.16); color:var(--phos);
    text-shadow:var(--glow-1);
  }
  .winbody{padding:var(--s5) var(--s5);}

  /* blinking block cursor */
  .cur{
    display:inline-block; width:8px; height:14px; vertical-align:-2px;
    background:var(--phos); margin-left:2px;
    box-shadow:var(--glow-2);
    animation:blink 1.06s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  /* status pills (ASCII bracket style) */
  .pill{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid currentColor; padding:2px 9px; font-size:11px;
    letter-spacing:.5px; line-height:1.5; white-space:nowrap;
  }
  .pill.ok{color:var(--phos); text-shadow:var(--glow-1); background:rgba(57,255,138,.06)}
  .pill.warn{color:var(--amber); background:rgba(255,176,0,.06)}
  .pill.down{color:var(--red); background:rgba(255,77,77,.06)}
  .pill.dim{color:var(--txt-dim); border-color:var(--line-bright)}

  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
  .dot.ok{background:var(--phos); box-shadow:0 0 9px var(--phos); animation:pulse 1.8s ease-in-out infinite}
  .dot.warn{background:var(--amber); box-shadow:0 0 9px var(--amber); animation:pulse 1.4s ease-in-out infinite}
  .dot.down{background:var(--red); box-shadow:0 0 9px var(--red); animation:pulse .9s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  /* buttons */
  .btn{
    display:inline-flex; align-items:center; gap:7px;
    border:1px solid var(--line-bright); color:var(--phos);
    background:rgba(57,255,138,.04);
    padding:9px 16px; font-family:var(--mono); font-size:12.5px;
    letter-spacing:.5px; cursor:pointer; text-decoration:none; line-height:1;
    transition:none;
  }
  .btn:hover{background:rgba(57,255,138,.1); border-color:var(--phos-dim)}
  .btn .ic{font-size:13px; color:var(--phos-dim)}
  .btn.primary{
    border-color:var(--phos); background:rgba(57,255,138,.18); color:var(--phos-bright);
    text-shadow:var(--glow-2);
    box-shadow:0 0 16px rgba(57,255,138,.2), inset 0 0 14px rgba(57,255,138,.1);
  }
  .btn.primary .ic{color:var(--phos)}
  .btn.primary:hover{background:rgba(57,255,138,.26)}
  .btn.ghost{border-color:var(--line-2); color:var(--txt-dim); background:transparent}
  .btn.ghost:hover{color:var(--txt); border-color:var(--line-bright)}
  .btn.danger{border-color:var(--red-dim); color:var(--red); background:rgba(255,77,77,.05)}
  .btn.danger .ic{color:var(--red)}
  .btn.danger:hover{background:rgba(255,77,77,.14); border-color:var(--red)}

  /* inputs */
  .field-label{font-size:11px; color:var(--txt-dim); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:var(--s2); display:block}
  .input{
    width:100%; background:#000; border:1px solid var(--line-bright);
    color:var(--phos); font-family:var(--mono); font-size:13px;
    padding:11px 13px 11px 26px; outline:none; text-shadow:var(--glow-1);
  }
  .input:focus{border-color:var(--phos-dim); box-shadow:0 0 12px rgba(57,255,138,.12)}
  .inputrow{position:relative}
  .inputrow .prompt{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--phos); pointer-events:none; text-shadow:var(--glow-2)}

  /* key/value table */
  .kv{width:100%; border-collapse:collapse; font-size:13px}
  .kv td{padding:8px 0; border-bottom:1px dashed var(--line-2); vertical-align:top}
  .kv tr:last-child td{border-bottom:none}
  .kv td:first-child{color:var(--txt-dim); width:168px; padding-right:18px; letter-spacing:.3px}
  .kv td:last-child{color:var(--phos)}
  .mask{color:var(--txt-fade); letter-spacing:1px}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:var(--s5)}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:var(--s5)}
  .col{display:flex; flex-direction:column; gap:var(--s5)}
  @media(max-width:880px){.grid2,.grid3{grid-template-columns:1fr}}

  /* sub-card inside panel */
  .subcard{border:1px solid var(--line-bright); background:rgba(57,255,138,.025)}
  .subcard .sc-head{
    padding:9px var(--s4); border-bottom:1px solid var(--line-2);
    font-size:11px; color:var(--phos-dim); letter-spacing:1.5px; text-transform:uppercase;
    display:flex; align-items:center; gap:var(--s2);
  }
  .subcard .sc-body{padding:var(--s2) var(--s4) var(--s4)}

  /* progress bar */
  .pb-head{display:flex; justify-content:space-between; align-items:baseline; gap:var(--s4)}
  .bar{
    height:20px; border:1px solid var(--line-bright); background:#000; position:relative;
    margin:var(--s3) 0 var(--s2); overflow:hidden;
  }
  .bar > i{
    display:block; height:100%;
    background:repeating-linear-gradient(90deg, var(--phos) 0 7px, rgba(57,255,138,.4) 7px 10px);
    box-shadow:0 0 12px rgba(57,255,138,.4);
  }
  .bar-meta{display:flex; justify-content:space-between; gap:var(--s4); font-size:12px; color:var(--txt-dim); flex-wrap:wrap}
  .bar-ascii{color:var(--phos-dim); letter-spacing:-.5px; white-space:nowrap; overflow:hidden}

  /* terminal log */
  .term{
    background:#000; border:1px solid var(--line-2); padding:var(--s3) var(--s4);
    font-size:12.5px; line-height:1.7;
  }
  .term .ln{color:var(--txt-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .term .ln b{color:var(--phos)}
  .term .ts{color:var(--phos-dimmer)}
  .term .ok{color:var(--phos); text-shadow:var(--glow-1)}
  .term .warn{color:var(--amber)}
  .term .err{color:var(--red)}
  .term .q{color:var(--txt-fade)}

  /* big status block */
  .bigstat{
    display:flex; align-items:center; gap:var(--s4);
    border:1px solid var(--line-bright); padding:var(--s4) var(--s5);
    background:linear-gradient(135deg, rgba(57,255,138,.08), rgba(0,0,0,0) 70%);
    box-shadow:inset 0 0 24px rgba(57,255,138,.05);
  }
  .ring{
    width:56px;height:56px;border-radius:50%;
    border:2px solid var(--phos); position:relative; flex:none;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 20px rgba(57,255,138,.35), inset 0 0 16px rgba(57,255,138,.2);
  }
  .ring::before{
    content:""; position:absolute; inset:-6px; border-radius:50%;
    border:1px solid rgba(57,255,138,.25);
    animation:halo 1.8s ease-out infinite;
  }
  @keyframes halo{0%{transform:scale(.85);opacity:.8}100%{transform:scale(1.25);opacity:0}}
  .ring i{width:18px;height:18px;border-radius:50%;background:var(--phos);box-shadow:0 0 14px var(--phos);animation:pulse 1.8s ease-in-out infinite}
  .bigstat .lbl{font-size:11px;color:var(--txt-dim);letter-spacing:2.5px;text-transform:uppercase}
  .bigstat .val{font-size:27px;color:var(--phos-bright);text-shadow:var(--glow-3);letter-spacing:1px;line-height:1.2}
  .bigstat .note{color:var(--phos-dim);font-size:12px;margin-top:var(--s1)}

  /* mini stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin-top:var(--s4)}
  .tile{border:1px solid var(--line-2);padding:13px 14px;background:rgba(57,255,138,.02)}
  .tile .t{font-size:10.5px;color:var(--txt-dim);letter-spacing:1.5px;text-transform:uppercase}
  .tile .v{font-size:18px;color:var(--phos);margin-top:6px;text-shadow:var(--glow-1)}
  .tile .v small{font-size:12px;color:var(--phos-dim)}

  /* checkbox */
  .check{display:flex;align-items:center;gap:var(--s3);padding:11px 0;border-bottom:1px dashed var(--line-2);font-size:13px}
  .check:last-of-type{border-bottom:none}
  .box{
    width:18px;height:18px;border:1px solid var(--phos);flex:none;
    display:flex;align-items:center;justify-content:center;color:var(--phos);font-size:12px;line-height:1;
    text-shadow:var(--glow-1); background:rgba(57,255,138,.08);
  }
  .box.off{border-color:var(--line-bright);color:transparent;background:#000}
  .check .nm{color:var(--phos)}
  .check .desc{color:var(--txt-dim);font-size:11.5px;margin-top:2px}
  .check .sysnote{margin-left:auto;font-size:10px;color:var(--phos-dimmer);border:1px solid var(--line-bright);padding:2px 8px;white-space:nowrap;align-self:center}
  .check .sysnote.req{color:var(--phos);border-color:var(--phos-dim)}

  /* toggle */
  .tog{display:flex;align-items:center;gap:var(--s3);padding:13px 0;border-bottom:1px dashed var(--line-2)}
  .tog:last-child{border-bottom:none}
  .switch{
    width:46px;height:22px;border:1px solid var(--phos-dim);position:relative;flex:none;background:rgba(57,255,138,.08);
  }
  .switch i{position:absolute;top:1px;width:18px;height:18px;background:var(--phos);box-shadow:0 0 8px var(--phos)}
  .switch.on i{right:1px}
  .switch.off{border-color:var(--line-bright);background:#000}
  .switch.off i{left:1px;background:var(--txt-fade);box-shadow:none}
  .tog .meta{flex:1}
  .tog .meta .ttl{font-size:13px;color:var(--phos)}
  .tog .meta .sub{font-size:11px;color:var(--txt-dim);margin-top:3px}
  .winonly{font-size:10px;color:var(--amber);border:1px solid var(--amber-dim);padding:2px 8px;letter-spacing:.5px;white-space:nowrap}
  .macos-tag{font-size:10px;color:var(--phos-dim);border:1px solid var(--line-bright);padding:2px 8px;letter-spacing:.5px;white-space:nowrap}

  /* update banner */
  .updbanner{
    display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;
    border:1px solid var(--phos-dim);padding:var(--s4);margin-top:var(--s4);
    background:linear-gradient(90deg, rgba(57,255,138,.12), rgba(0,0,0,0) 80%);
    box-shadow:inset 0 0 18px rgba(57,255,138,.06);
  }

  /* tray / menubar dropdown */
  .traywrap{display:flex;flex-direction:column;gap:var(--s3)}
  .tray-os{
    font-size:11px;letter-spacing:1px;display:flex;align-items:center;gap:var(--s2);
    padding-bottom:var(--s1);
  }
  .traymenu{
    border:1px solid var(--line-bright);background:var(--bg-2);
    box-shadow:0 0 30px rgba(57,255,138,.08);
  }
  .traymenu.warn{box-shadow:0 0 30px rgba(255,176,0,.1);border-color:var(--amber-dim)}
  .traymenu.down{box-shadow:0 0 30px rgba(255,77,77,.1);border-color:var(--red-dim)}
  .traymenu .head{padding:var(--s3) var(--s4);border-bottom:1px solid var(--line-2);background:linear-gradient(180deg,rgba(57,255,138,.08),transparent)}
  .traymenu.warn .head{background:linear-gradient(180deg,rgba(255,176,0,.08),transparent)}
  .traymenu.down .head{background:linear-gradient(180deg,rgba(255,77,77,.08),transparent)}
  .traymenu .item{
    padding:10px var(--s4);font-size:13px;color:var(--txt);display:flex;align-items:center;gap:10px;border-bottom:1px dashed var(--line-2);cursor:default;
  }
  .traymenu .item .ic{color:var(--phos-dim);width:14px;text-align:center}
  .traymenu .item:hover{background:rgba(57,255,138,.08)}
  .traymenu .item.hl{color:var(--phos);text-shadow:var(--glow-1)}
  .traymenu .item.hl .ic{color:var(--phos)}
  .traymenu .item .k{margin-left:auto;color:var(--phos-dimmer);font-size:11px;border:1px solid var(--line-2);padding:0 6px}
  .traymenu .sep{height:1px;background:var(--line-2)}
  .traymenu .item.quit{color:var(--red)}
  .traymenu .item.quit .ic{color:var(--red)}
  .traystate{display:flex;align-items:center;gap:9px;font-size:13px}
  .traysub{color:var(--txt-dim);font-size:11px;margin-top:6px;padding-left:17px}

  /* badges */
  .flag{font-size:15px}
  .badgeproto{
    border:1px solid var(--phos);color:var(--phos);padding:2px 9px;font-size:11px;
    text-shadow:var(--glow-1);background:rgba(57,255,138,.1);letter-spacing:1px;
  }
  .badgeproto.http{border-color:var(--amber);color:var(--amber);text-shadow:none;background:rgba(255,176,0,.08)}

  .legend{display:flex;gap:var(--s5);flex-wrap:wrap;margin-top:var(--s4);font-size:12px;color:var(--txt-dim)}
  .legend span{display:flex;align-items:center;gap:7px}
  .legend .sysplit{color:var(--phos-dim);margin-left:auto}

  .help{font-size:11px;color:var(--phos-dimmer);margin-top:9px;line-height:1.6}
  .help b{color:var(--phos-dim)}

  .footer{margin-top:var(--s7);text-align:center;color:var(--phos-dimmer);font-size:11px;letter-spacing:1.5px}
  .footer .rule{height:1px;background:repeating-linear-gradient(to right,var(--line-bright) 0 7px,transparent 7px 14px);margin-bottom:var(--s4);opacity:.7}
  .footer b{color:var(--phos-dim)}

  .stepper{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt-fade);letter-spacing:1px}
  .stepper .on{color:var(--phos);text-shadow:var(--glow-1)}
  .stepper .done{color:var(--phos-dim)}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===================== MASTHEAD ===================== -->
  <div class="masthead panel-bg">
    <div class="mast-top">
      <div class="logo">// <b>clod-helper</b> · phosphor terminal build</div>
      <div class="mast-meta">
        <span class="pill ok"><span class="dot ok"></span>[ SYSTEM NOMINAL ]</span>
        <span class="pill dim">v0.6.0</span>
      </div>

          <div class="menu-item"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 1 2.6 6.1M3.5 12V7M3.5 12H8"/></svg></span>Перезапустить мост</div>
          <div class="menu-item"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4h6v6M20 4l-9 9M19 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></svg></span>Открыть</div>
          <div class="menu-item"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg></span>Проверить прокси</div>
          <div class="menu-sep"></div>
          <div class="menu-item danger"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M16 16l4-4-4-4M20 12H9"/></svg></span>Выход</div>
        </div>
      </div>
    </div>

    <!-- RED — stopped -->
    <div>
      <div class="mini-os-tag">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>
        Мост остановлен
      </div>
      <div class="tray-os">
        <span style="display:flex;align-items:center;gap:5px"><span class="dot r" style="width:8px;height:8px"></span></span>
        <svg viewBox="0 0 24 24" fill="#5e5e63"><path d="M12 3a9 9 0 0 0-9 9v5l-1 2h20l-1-2v-5a9 9 0 0 0-9-9z"/></svg>
        <span style="font-weight:600">14:08</span>
      </div>
      <div class="menucard" style="border-radius:0 0 13px 13px">
        <div class="menutop">
          <span class="dot r"></span>
          <div style="flex:1"><div style="font-size:13.5px;font-weight:700">Мост остановлен</div><div style="font-size:11.5px;color:var(--ink3)">Claude временно без прокси</div></div>
          <span class="pill pill-red">офлайн</span>
        </div>
        <div style="padding:5px 0">
          <div class="menu-item recover"><span class="mi"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>Восстановить</div>
          <div class="menu-item"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 1 2.6 6.1M3.5 12V7M3.5 12H8"/></svg></span>Перезапустить мост</div>
          <div class="menu-item"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4h6v6M20 4l-9 9M19 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></svg></span>Открыть</div>
          <div class="menu-sep"></div>
          <div class="menu-item danger"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M16 16l4-4-4-4M20 12H9"/></svg></span>Выход</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== РАЗЛИЧИЯ СИСТЕМ ===================== -->
  <div class="seclabel">Различия систем — учтено автоматически</div>
  <div class="platform-note">
    <div class="pn">
      <h4>
        <span class="os-ico" style="background:rgba(0,122,255,.12)"><svg viewBox="0 0 24 24" width="14" height="14" fill="var(--blue)"><path d="M3 5.3 10.3 4.3v6.8H3V5.3zM11.2 4.2 21 3v8.1h-9.8V4.2zM3 12h7.3v6.8L3 17.7V12zM11.2 12H21v9l-9.8-1.3V12z"/></svg></span>
        Windows
      </h4>
      <div class="line"><span class="k">Ярлык</span><span>Рабочий стол + меню «Пуск»</span></div>
      <div class="line"><span class="k">Автозапуск</span><span>Папка <code>Startup</code> · <code>clod.vbs</code></span></div>
      <div class="line"><span class="k">Брандмауэр</span><span>Правило Windows Defender (только тут)</span></div>
      <div class="line"><span class="k">Иконка</span><span>Системный трей рядом с часами</span></div>
    </div>
    <div class="pn">
      <h4>
        <span class="os-ico" style="background:rgba(142,142,147,.16)"><svg viewBox="0 0 24 24" width="14" height="14" fill="#3a3a3c"><path d="M17.1 12.5c0-2.1 1.7-3.1 1.8-3.2-1-1.4-2.5-1.6-3-1.7-1.3-.1-2.5.8-3.1.8-.6 0-1.6-.8-2.7-.7-1.4 0-2.6.8-3.4 2-1.4 2.5-.4 6.2 1 8.2.7 1 1.4 2.1 2.5 2.1 1 0 1.4-.7 2.6-.7s1.6.7 2.7.7c1.1 0 1.8-1 2.5-2 .8-1.1 1.1-2.2 1.1-2.3-.1 0-2.1-.8-2.1-3.1zM15.3 6.1c.6-.7 1-1.6.9-2.6-.8 0-1.8.6-2.4 1.3-.5.6-1 1.5-.9 2.5.9.1 1.8-.5 2.4-1.2z"/></svg></span>
        macOS
      </h4>
      <div class="line"><span class="k">Ярлык</span><span>Программы + Launchpad</span></div>
      <div class="line"><span class="k">Автозапуск</span><span>LaunchAgent <code>launchd</code> (.plist)</span></div>
      <div class="line"><span class="k">Брандмауэр</span><span>Не требуется — управляется системой</span></div>
      <div class="line"><span class="k">Иконка</span><span>Менюбар в правом верхнем углу</span></div>
    </div>
  </div>

  <div class="footnote">Clod Helper 0.5.4 · Cupertino Native · данные демонстрационные</div>

</div>

  <script type="text/html" id="v9"><!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clod Helper — Soft Material</title>
<style>
  :root{
    /* ===== Material 3 · Light pastel tonal system ===== */
    --bg:#F3EDFA;
    --surface:#FEF7FF;
    --surface-1:#F8F2FB;
    --surface-2:#F2ECF7;
    --surface-3:#ECE5F1;
    --surface-4:#E6DEEC;

    --primary:#6750A4;
    --primary-strong:#574191;
    --on-primary:#FFFFFF;
    --primary-container:#EADDFF;
    --on-primary-container:#21005D;

    --secondary:#625B71;
    --secondary-container:#E8DEF8;
    --on-secondary-container:#1D192B;

    --tertiary:#7D5260;
    --tertiary-container:#FFD8E4;
    --on-tertiary-container:#31111D;

    --outline:#CAC4D0;
    --outline-variant:#E6E0EC;
    --on-surface:#1C1B1F;
    --on-surface-variant:#49454F;

    --success:#146C2E;
    --success-container:#C7F0CF;
    --on-success-container:#06270F;
    --warn:#7A5900;
    --warn-container:#FFE08A;
    --on-warn-container:#241A00;
    --error:#B3261E;
    --error-container:#F9DEDC;
    --on-error-container:#410E0B;

    --green:#2E7D32;
    --amber:#C98A00;
    --red:#C62828;

    /* Elevation — soft, purple-tinted (Material light) */
    --e1:0 1px 2px rgba(33,0,93,.08), 0 1px 3px 1px rgba(33,0,93,.05);
    --e2:0 1px 2px rgba(33,0,93,.10), 0 2px 6px 2px rgba(33,0,93,.06);
    --e3:0 4px 8px 3px rgba(33,0,93,.07), 0 1px 3px rgba(33,0,93,.10);
    --e4:0 6px 10px 4px rgba(33,0,93,.07), 0 2px 3px rgba(33,0,93,.10);

    --r-xs:8px; --r-s:12px; --r-m:16px; --r-l:20px; --r-xl:28px; --r-full:999px;

    --font:'Roboto','Inter',-apple-system,'Segoe UI',system-ui,sans-serif;
    --mono:ui-monospace,'JetBrains Mono','Roboto Mono',Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1100px 560px at 82% -12%, #EADDFF7A, transparent 58%),
      radial-gradient(820px 480px at -6% 6%, #FFD8E455, transparent 52%),
      radial-gradient(720px 520px at 50% 120%, #D6EAFF44, transparent 55%),
      var(--bg);
    color:var(--on-surface);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    line-height:1.45;
    padding:44px 24px 96px;
  }
  .wrap{max-width:1180px;margin:0 auto}
  ::selection{background:var(--primary-container);color:var(--on-primary-container)}

  /* ===================== HEADER ===================== */
  .app-head{
    display:flex;align-items:center;gap:18px;margin-bottom:8px;flex-wrap:wrap;
    background:var(--surface);border:1px solid var(--outline-variant);
    border-radius:var(--r-xl);box-shadow:var(--e1);padding:18px 22px;
  }
  .logo{
    width:56px;height:56px;border-radius:18px;flex:none;
    background:linear-gradient(140deg,#8A72D0,#6750A4 58%,#4D3C80);
    box-shadow:var(--e2);display:grid;place-items:center;position:relative;
  }
  .logo::after{content:"";position:absolute;inset:0;border-radius:inherit;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.4)}
  .logo svg{width:30px;height:30px;position:relative;z-index:1}
  .app-title h1{font-size:25px;margin:0;font-weight:600;letter-spacing:.2px}
  .app-title p{margin:3px 0 0;color:var(--on-surface-variant);font-size:13.5px;max-width:520px}
  .head-spacer{flex:1}
  .os-switch{
    display:inline-flex;background:var(--surface-3);border-radius:var(--r-full);padding:4px;gap:4px;
    box-shadow:inset 0 0 0 1px var(--outline-variant);
  }
  .os-switch button{
    border:0;background:transparent;font-family:inherit;font-size:13px;font-weight:600;
    color:var(--on-surface-variant);padding:8px 16px;border-radius:var(--r-full);cursor:default;
    display:inline-flex;align-items:center;gap:7px;transition:.15s;
  }
  .os-switch .on{background:var(--primary);color:#fff;box-shadow:var(--e1)}
  .head-note{
    display:flex;align-items:center;gap:9px;margin:14px 4px 0;
    color:var(--on-surface-variant);font-size:12.5px;
  }
  .head-note .pt-win,.head-note .pt-mac{margin:0}

  /* ===================== SECTION HEADINGS ===================== */
  h2.section{
    font-size:13px;font-weight:700;color:var(--secondary);margin:40px 4px 16px;
    text-transform:uppercase;letter-spacing:1.2px;display:flex;align-items:center;gap:10px;
  }
  h2.section .num{
    width:26px;height:26px;border-radius:9px;background:var(--secondary-container);
    color:var(--on-secondary-container);display:grid;place-items:center;font-size:12px;font-weight:700;
  }
  h2.section::after{content:"";flex:1;height:1px;background:var(--outline-variant)}

  .grid{display:grid;gap:20px}
  .g2{grid-template-columns:1fr 1fr}
  .g12{grid-template-columns:1.12fr .88fr}
  @media(max-width:900px){.g2,.g12{grid-template-columns:1fr}}

  /* ===================== CARD ===================== */
  .card{
    background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--e1);
    border:1px solid var(--outline-variant);padding:24px;
  }
  .card.tonal{background:var(--surface-1)}
  .card .ttl{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .card .ttl h3{margin:0;font-size:18px;font-weight:600;letter-spacing:.1px}
  .card .ttl .sub{color:var(--on-surface-variant);font-size:13px;margin-top:3px;line-height:1.35}
  .ico-badge{width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center}
  .ico-badge svg{width:21px;height:21px}
  .ico-badge.sm{width:34px;height:34px;border-radius:11px}
  .ico-badge.sm svg{width:18px;height:18px}
  .ib-primary{background:var(--primary-container);color:var(--on-primary-container)}
  .ib-sec{background:var(--secondary-container);color:var(--on-secondary-container)}
  .ib-ter{background:var(--tertiary-container);color:var(--on-tertiary-container)}
  .ib-ok{background:var(--success-container);color:var(--on-success-container)}

  /* ===================== APP WINDOW MOCK ===================== */
  .window{
    background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--e3);
    overflow:hidden;border:1px solid var(--outline-variant);
  }
  .titlebar{
    display:flex;align-items:center;gap:14px;padding:13px 18px;
    background:linear-gradient(180deg,#F4EEF9,#EEE7F4);
    border-bottom:1px solid var(--outline-variant);
  }
  .traffic{display:flex;gap:9px}
  .traffic i{width:13px;height:13px;border-radius:50%;display:block}
  .tl-r{background:#FF5F57;box-shadow:inset 0 0 0 .5px #E0443E}
  .tl-y{background:#FEBC2E;box-shadow:inset 0 0 0 .5px #DEA123}
  .tl-g{background:#28C840;box-shadow:inset 0 0 0 .5px #1DAD2B}
  .titlebar .name{font-weight:600;font-size:13.5px;letter-spacing:.1px}
  .titlebar .right{margin-left:auto;display:flex;align-items:center;gap:10px}

  /* ===================== STEPPER ===================== */
  .steps{display:flex;align-items:center;gap:6px;padding:18px 24px 6px;flex-wrap:wrap}
  .step{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--on-surface-variant)}
  .step .dot{
    width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
    background:var(--surface-3);font-size:12px;font-weight:700;color:var(--on-surface-variant);
    box-shadow:inset 0 0 0 1px var(--outline-variant);
  }
  .step.done .dot{background:var(--success-container);color:var(--on-success-container);box-shadow:none}
  .step.done .dot svg{width:15px;height:15px}
  .step.active{color:var(--on-surface);font-weight:600}
  .step.active .dot{background:var(--primary);color:#fff;box-shadow:var(--e1)}
  .step .line{width:38px;height:2px;background:var(--outline-variant);border-radius:2px;margin:0 4px}
  .step.done + .line{background:var(--success-container)}

  /* ===================== FORM FIELDS ===================== */
  .field{position:relative;margin:10px 0 4px}
  .field label{
    position:absolute;top:-9px;left:14px;background:var(--surface);padding:0 6px;
    font-size:12px;color:var(--primary);font-weight:600;letter-spacing:.2px;
  }
  .field .inp{
    width:100%;border:2px solid var(--primary);border-radius:var(--r-xs);
    background:var(--surface);padding:15px 16px;font-family:var(--mono);font-size:14px;
    color:var(--on-surface);display:flex;align-items:center;gap:8px;line-height:1.2;
  }
  .field.idle .inp{border:1.5px solid var(--outline)}
  .field.idle label{color:var(--on-surface-variant);font-weight:500}
  .field .hint{font-size:12px;color:var(--on-surface-variant);margin:8px 14px 0}
  .caret{width:2px;height:18px;background:var(--primary);display:inline-block;margin-left:1px;border-radius:1px}

  /* ===================== CHIPS ===================== */
  .chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{
    display:inline-flex;align-items:center;gap:7px;border-radius:var(--r-full);padding:7px 13px;
    font-size:12.5px;font-weight:600;background:var(--surface);border:1px solid var(--outline);
    color:var(--on-surface-variant);line-height:1;
  }
  .chip.sel{background:var(--secondary-container);border-color:transparent;color:var(--on-secondary-container)}
  .chip.ok{background:var(--success-container);border-color:transparent;color:var(--on-success-container)}
  .chip.proto{background:var(--primary-container);border-color:transparent;color:var(--on-primary-container);font-weight:700}
  .chip.warn{background:var(--warn-container);border-color:transparent;color:var(--on-warn-container)}
  .chip.err{background:var(--error-container);border-color:transparent;color:var(--on-error-container)}
  .chip .em{font-size:14px;line-height:1}
  .chip svg{width:14px;height:14px}

  /* ===================== BUTTONS ===================== */
  .btn{
    border:0;font-family:inherit;font-size:14px;font-weight:600;cursor:default;
    border-radius:var(--r-full);padding:12px 22px;display:inline-flex;align-items:center;gap:9px;
    transition:.15s;letter-spacing:.2px;line-height:1;
  }
  .btn svg{width:18px;height:18px}
  .btn-filled{background:var(--primary);color:#fff;box-shadow:var(--e1)}
  .btn-tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
  .btn-tonal.prim{background:var(--primary-container);color:var(--on-primary-container)}
  .btn-out{background:transparent;color:var(--primary);box-shadow:inset 0 0 0 1px var(--outline)}
  .btn-text{background:transparent;color:var(--primary);padding:12px 16px}
  .btn-danger{background:var(--error-container);color:var(--on-error-container)}
  .btn-sm{padding:9px 16px;font-size:13px}
  .btn-sm svg{width:16px;height:16px}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  /* ===================== PROXY VERIFY ===================== */
  .verify{
    margin-top:20px;background:var(--surface-1);border-radius:var(--r-m);padding:18px;
    border:1px solid var(--outline-variant);
  }
  .verify .top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .verify .top b{font-size:14px;color:var(--success)}
  .pulse{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #2E7D3226}
  .kv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .kv{background:var(--surface);border-radius:var(--r-s);padding:12px 14px;border:1px solid var(--outline-variant)}
  .kv .k{font-size:11px;color:var(--on-surface-variant);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
  .kv .v{font-size:15px;font-weight:600;margin-top:4px;display:flex;align-items:center;gap:7px}
  .kv .v.mono{font-family:var(--mono);font-size:14px}
  .kv .v .em{font-size:17px}

  /* ===================== DASHBOARD HERO ===================== */
  .status-hero{
    background:linear-gradient(135deg,#E7F6EB,#D9F1DF);
    border:1px solid #BCE5C5;border-radius:var(--r-l);padding:22px 24px;
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  }
  .status-hero .ring{
    width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;
    background:#fff;box-shadow:var(--e1);
  }
  .status-hero .ring .core{
    width:22px;height:22px;border-radius:50%;background:var(--green);
    box-shadow:0 0 0 6px #2E7D321F, 0 0 16px #2E7D3266;
  }
  .status-hero h3{margin:0;font-size:23px;font-weight:600;color:#0B3D17;letter-spacing:.2px}
  .status-hero .meta{color:#1E5C2A;font-size:13.5px;margin-top:4px}
  .status-hero .meta b{font-weight:700}

  .dash-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}
  .stat{background:var(--surface-1);border:1px solid var(--outline-variant);border-radius:var(--r-m);padding:14px 16px}
  .stat .lbl{
    font-size:11.5px;color:var(--on-surface-variant);text-transform:uppercase;letter-spacing:.6px;
    display:flex;align-items:center;gap:7px;font-weight:600;
  }
  .stat .val{font-size:16px;font-weight:600;margin-top:6px;font-family:var(--mono)}
  .stat .val.txt{font-family:var(--font)}
  .health-bar{height:8px;border-radius:var(--r-full);background:var(--surface-3);overflow:hidden;margin-top:10px;box-shadow:inset 0 0 0 1px var(--outline-variant)}
  .health-bar i{display:block;height:100%;width:88%;background:linear-gradient(90deg,#3FA34D,#2E7D32);border-radius:var(--r-full)}

  /* ===================== SETTINGS ROWS ===================== */
  .row{display:flex;align-items:center;gap:14px;padding:16px 2px;border-bottom:1px solid var(--outline-variant)}
  .row:last-child{border-bottom:0}
  .row .txt{flex:1;min-width:0}
  .row .txt .t{font-weight:600;font-size:15px}
  .row .txt .d{font-size:12.5px;color:var(--on-surface-variant);margin-top:3px;line-height:1.4}
  .platform-tag{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:var(--r-full);letter-spacing:.4px;flex:none;display:inline-flex;align-items:center;gap:5px}
  .pt-win{background:#DCE6FF;color:#21408A}
  .pt-mac{background:#EFE2F7;color:#5B2B7A}
  .pt-both{background:var(--secondary-container);color:var(--on-secondary-container)}

  /* switch */
  .sw{width:52px;height:32px;border-radius:var(--r-full);flex:none;position:relative;background:var(--surface-3);
    box-shadow:inset 0 0 0 2px var(--outline)}
  .sw i{position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:50%;background:var(--outline);transition:.2s}
  .sw.on{background:var(--primary);box-shadow:none}
  .sw.on i{left:26px;width:24px;height:24px;top:4px;background:#fff;box-shadow:var(--e1)}

  /* checkbox */
  .cb{width:22px;height:22px;border-radius:6px;flex:none;display:grid;place-items:center;

  <script type="text/html" id="v10"><!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clod Helper — Graphite Luxe</title>
<style>
  :root{
    /* palette */
    --bg:#0E0E0F;
    --panel:#1C1C1E;
    --panel-2:#202022;
    --panel-3:#252528;
    --sunk:#141415;
    --ink:#EDEDED;
    --muted:#9C9C9C;
    --faint:#6E6E72;
    --gold:#C8A24B;
    --gold-hi:#E3C477;
    --gold-soft:rgba(200,162,75,.14);
    --gold-line:rgba(200,162,75,.32);
    --green:#3FB984;
    --green-dot:#46D69E;
    --amber:#E0B14C;
    --red:#E2685C;
    --hair:rgba(255,255,255,.06);
    --hair-2:rgba(255,255,255,.10);
    /* type */
    --serif:'Cormorant Garamond','Playfair Display',Georgia,'Times New Roman',serif;
    --sans:-apple-system,'Segoe UI',Inter,Roboto,system-ui,sans-serif;
    --mono:ui-monospace,'JetBrains Mono',Consolas,'SF Mono',monospace;
    /* radii — consistent scale */
    --r-xs:8px; --r-sm:10px; --r-md:12px; --r-lg:16px; --r-pill:999px;
    /* shadows */
    --shadow:0 24px 64px -30px rgba(0,0,0,.85), 0 1px 0 rgba(255,255,255,.03) inset;
    --shadow-pop:0 32px 72px -26px rgba(0,0,0,.9);
    --gold-glow:0 12px 28px -12px rgba(200,162,75,.55), 0 1px 0 rgba(255,255,255,.28) inset;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 700px at 10% -10%, rgba(200,162,75,.06), transparent 55%),
      radial-gradient(960px 620px at 102% -4%, rgba(200,162,75,.045), transparent 52%),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
    padding:48px 24px 88px;
  }
  .wrap{max-width:1180px;margin:0 auto}

  /* ===== Masthead ===== */
  .masthead{
    display:flex;align-items:center;justify-content:space-between;
    gap:24px;flex-wrap:wrap;margin-bottom:40px;
  }
  .brand{display:flex;align-items:center;gap:18px}
  .crest{
    width:60px;height:60px;border-radius:16px;flex:none;
    background:linear-gradient(155deg,#27272b,#161618);
    border:1px solid var(--gold-line);
    display:grid;place-items:center;position:relative;
    box-shadow:0 12px 32px -16px rgba(0,0,0,.9), 0 0 0 1px rgba(0,0,0,.4) inset;
  }
  .crest::after{content:"";position:absolute;inset:6px;border:1px solid rgba(200,162,75,.18);border-radius:11px}
  .crest svg{position:relative;z-index:2}
  .brand h1{
    font-family:var(--serif);font-weight:600;letter-spacing:.5px;
    font-size:42px;line-height:1;margin:0 0 6px;color:var(--ink);
  }
  .brand h1 .lux{color:var(--gold);font-style:italic;font-weight:500}
  .brand .sub{color:var(--muted);font-size:13.5px;letter-spacing:.3px}
  .os-switch{
    display:inline-flex;align-items:center;background:var(--panel);
    border:1px solid var(--hair-2);border-radius:var(--r-pill);padding:4px;gap:2px;
    box-shadow:var(--shadow);
  }
  .os-switch button{
    font-family:var(--sans);font-size:13px;color:var(--muted);
    background:transparent;border:0;padding:9px 18px;border-radius:var(--r-pill);cursor:default;
    display:inline-flex;align-items:center;gap:8px;letter-spacing:.2px;
  }
  .os-switch button.on{
    color:#15140f;background:linear-gradient(180deg,#d8b25c,#c8a24b);
    font-weight:650;box-shadow:0 6px 16px -8px rgba(200,162,75,.6);
  }

  /* ===== Section eyebrow ===== */
  .eyebrow{
    font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);
    font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:12px;
  }
  .eyebrow .num{
    font-family:var(--serif);font-style:italic;font-size:15px;letter-spacing:0;
    color:var(--gold-hi);opacity:.85;
  }
  .eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-line),transparent)}

  /* ===== Grid ===== */
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
  .col-7{grid-column:span 7}
  .col-5{grid-column:span 5}
  .col-6{grid-column:span 6}
  .col-12{grid-column:span 12}
  .section{margin-top:48px}

  /* ===== Window chrome ===== */
  .window{
    background:var(--panel);border:1px solid var(--hair-2);border-radius:var(--r-lg);
    overflow:hidden;box-shadow:var(--shadow);
  }
  .titlebar{
    display:flex;align-items:center;gap:12px;padding:13px 16px;
    background:linear-gradient(180deg,#202022,#1a1a1c);
    border-bottom:1px solid var(--hair);
  }
  /* macOS traffic lights */
  .traffic{display:flex;gap:9px}
  .traffic i{width:12px;height:12px;border-radius:50%;display:block}
  .traffic .r{background:#ED6A5E;box-shadow:0 0 0 1px rgba(0,0,0,.25) inset}
  .traffic .y{background:#F4BD4E;box-shadow:0 0 0 1px rgba(0,0,0,.25) inset}
  .traffic .g{background:#61C554;box-shadow:0 0 0 1px rgba(0,0,0,.25) inset}
  .titlebar .ttl{font-size:12.5px;color:var(--muted);letter-spacing:.4px;margin-left:4px}
  /* Windows window controls */
  .win-ctl{margin-left:auto;display:flex;align-items:center;gap:2px}
  .win-ctl button{width:30px;height:22px;border:0;background:transparent;color:var(--faint);display:grid;place-items:center;border-radius:5px;cursor:default}
  .win-ctl button.x:hover{}
  .win-ctl svg{display:block}
  .win-tag{
    margin-left:auto;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--faint);border:1px solid var(--hair);border-radius:6px;padding:3px 9px;
    display:inline-flex;align-items:center;gap:7px;
  }
  .win-tag .os-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:.8}

  /* ===== Card ===== */
  .card{
    background:var(--panel);border:1px solid var(--hair-2);border-radius:var(--r-lg);
    box-shadow:var(--shadow);
  }
  .card .body{padding:28px 30px}
  .card-title{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.4px;margin:0;color:var(--ink)}
  .card-kicker{color:var(--muted);font-size:13px;margin-top:6px}
  .goldrule{height:1px;background:linear-gradient(90deg,transparent,var(--gold-line),transparent);margin:24px 0}
  .hairrule{height:1px;background:var(--hair);margin:24px 0}

  /* ===== Wizard steps ===== */
  .steps{display:flex;align-items:center;gap:0;margin-bottom:26px}
  .step{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12.5px;white-space:nowrap}
  .step .n{
    width:26px;height:26px;border-radius:50%;border:1px solid var(--hair-2);
    display:grid;place-items:center;font-size:12px;color:var(--muted);flex:none;
  }
  .step.done .n{border-color:var(--gold-line);color:var(--gold);background:var(--gold-soft)}
  .step.cur .n{background:linear-gradient(180deg,#d8b25c,#c8a24b);color:#15140f;border-color:transparent;font-weight:700;box-shadow:0 0 0 4px var(--gold-soft)}
  .step.cur{color:var(--ink)}
  .step-line{flex:1;height:1px;background:var(--hair);margin:0 12px;min-width:16px}
  .step.done + .step-line{background:linear-gradient(90deg,var(--gold-line),var(--hair))}

  .field-label{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:block}
  .input{
    display:flex;align-items:center;gap:10px;background:var(--sunk);
    border:1px solid var(--hair-2);border-radius:11px;padding:14px 16px;
    font-family:var(--mono);font-size:13.5px;color:var(--ink);
  }
  .input.focus{border-color:var(--gold-line);box-shadow:0 0 0 3px var(--gold-soft)}
  .input .pre{color:var(--faint)}
  .input .caret{width:2px;height:16px;background:var(--gold);margin-left:auto;opacity:.85}

  /* probe result */
  .probe{
    margin-top:16px;background:var(--panel-2);border:1px solid var(--hair);
    border-radius:var(--r-md);padding:18px 18px;
  }
  .probe-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .flag{font-size:24px;line-height:1}
  .probe-top .who{font-size:14.5px;color:var(--ink);font-weight:600}
  .probe-top .where{font-size:12px;color:var(--muted);margin-top:2px}
  .live{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:11.5px;color:var(--green);letter-spacing:.3px;font-weight:600}
  .pulse{width:8px;height:8px;border-radius:50%;background:var(--green-dot);box-shadow:0 0 0 4px rgba(70,214,158,.16)}
  .probe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .pstat .k{font-size:10.5px;color:var(--faint);letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px}
  .pstat .v{font-size:14px;color:var(--ink);font-family:var(--mono)}
  .pstat .v.good{color:var(--green)}
  .badge-auto{
    display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.5px;
    color:var(--gold);background:var(--gold-soft);border:1px solid var(--gold-line);
    padding:4px 10px;border-radius:7px;
  }

  .wizard-foot{display:flex;align-items:center;justify-content:space-between;margin-top:26px}
  .ghost{
    background:transparent;border:1px solid var(--hair-2);color:var(--muted);
    font-family:var(--sans);font-size:13.5px;padding:11px 20px;border-radius:var(--r-sm);cursor:default;
  }
  .cta{
    font-family:var(--sans);font-size:14px;font-weight:650;letter-spacing:.3px;
    color:#15140f;background:linear-gradient(180deg,#dcb65f,#c8a24b);
    border:0;padding:12px 26px;border-radius:var(--r-sm);cursor:default;
    display:inline-flex;align-items:center;gap:9px;box-shadow:var(--gold-glow);
  }
  .cta.sm{padding:9px 18px;font-size:13px}
  .cta svg{display:block}

  /* ===== Welcome (start) ===== */
  .welcome{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
  .welcome .left{flex:1;min-width:280px}
  .welcome .seal{
    width:88px;height:88px;border-radius:22px;flex:none;display:grid;place-items:center;position:relative;
    background:linear-gradient(160deg,#2a2a2e,#161618);border:1px solid var(--gold-line);

  }
  .welcome .seal::after{content:"";position:absolute;inset:9px;border:1px solid rgba(200,162,75,.22);border-radius:15px}
  .welcome h2{font-family:var(--serif);font-size:34px;font-weight:600;margin:0 0 10px;line-height:1.1}
  .welcome p{color:var(--muted);font-size:13.5px;margin:0 0 20px;max-width:520px}
  .perks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .perk{display:flex;gap:11px;align-items:flex-start;background:var(--panel-2);border:1px solid var(--hair);border-radius:var(--r-md);padding:13px 15px}
  .perk .pk-ic{width:30px;height:30px;border-radius:8px;flex:none;background:var(--gold-soft);border:1px solid var(--gold-line);display:grid;place-items:center;color:var(--gold)}
  .perk .pk-t{font-size:13px;color:var(--ink);font-weight:600}

  <script>
    var NAMES = {1:"Vantablack Refined — Clod Helper",2:"Arctic Light",3:"Nord Frost",4:"Solar Warm",5:"Neon Cyber",6:"Aurora Glass",7:"Phosphor Terminal",8:"Cupertino Native",9:"Soft Material",10:"Graphite Luxe"};
    var currentHtml = "";
    function show(n){
      var el = document.getElementById('v'+n);
      if(!el) return;
      var html = el.textContent;
      currentHtml = html;
      document.getElementById('stage').srcdoc = html;
      document.getElementById('stageTitle').textContent = (NAMES[n] ? (n + '. ' + NAMES[n]) : ('Вариант ' + n));
      var btns = document.querySelectorAll('.nav-btn');
      for(var i=0;i<btns.length;i++){
        btns[i].classList.toggle('active', btns[i].getAttribute('data-n') == String(n));
      }
    }
    function openTab(){
      if(!currentHtml) return;
      var w = window.open('', '_blank');
      if(!w) return;
      w.document.open();
      w.document.write(currentHtml);
      w.document.close();
    }
    document.addEventListener('keydown', function(e){
      if(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      var k = e.key;
      if(k === '0'){ if(document.getElementById('v10')) show(10); return; }
      if(k >= '1' && k <= '9'){ var n = parseInt(k,10); if(document.getElementById('v'+n)) show(n); }
    });
    show(1);
  </script>
