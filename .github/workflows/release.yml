name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      # Закреплено по SHA ветки stable: при таком закреплении имя
      # инструментария надо задать явно.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install npm dependencies
        run: npm ci

      # clod-bridge.exe не хранится в git (.gitignore) — собираем из bridge/.
      - name: Build bridge
        run: npm run bridge:build

      # Кэш хранит src-tauri/target целиком — с установщиками прошлых версий.
      # Без очистки в релиз 0.8.12 попал старый 0.8.11, и манифест указал на него.
      - name: Clean old installers
        shell: pwsh
        run: Remove-Item -Recurse -Force src-tauri/target/release/bundle -ErrorAction SilentlyContinue

      - name: Build Tauri app
        run: npm run tauri build
        env:
          # Pin Tauri bundler to plain (no signing) since we publish unsigned.
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Collect artifacts
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/release/bundle"
          $out = "release-assets"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          Get-ChildItem -Path "$bundleDir/nsis/*_${version}_*-setup.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName $out }
          Get-ChildItem $out

      # Суммы установщиков - сразу после сборки, отдельным артефактом.
      # scripts/publish-release.mjs перед подписью сверяет с ними файлы
      # черновика: подмена файла в релизе (утёкший токен) не пройдёт.
      # Формат строки как у sha256sum: "<sha256>  <имя>". Имя - как у файла
      # в сборке (GitHub потом заменит пробелы на точки).
      - name: Checksums of built installers
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/release/bundle"
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path build-sums -Force | Out-Null
          $lines = Get-ChildItem -Path "$bundleDir/nsis/*_${version}_*-setup.exe" |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          if (-not $lines) { throw "нет установщика для сумм" }
          [IO.File]::WriteAllText("build-sums/sums-windows.txt", (($lines -join "`n") + "`n"))
          Get-Content build-sums/sums-windows.txt

      - name: Upload artifacts (workflow run)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clod-helper-windows
          path: release-assets/*

      - name: Upload installer checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-sums-windows
          path: build-sums/sums-windows.txt
          if-no-files-found: error

      # Source maps интерфейса: для расшифровки подписей сбоев (в релиз не
      # кладутся). Появятся, когда сборка начнёт их делать.
      - name: Upload source maps
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sourcemaps
          path: sourcemaps/**
          retention-days: 90
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            bridge/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build bridge (universal)
        run: npm run bridge:build:mac

      - name: Build Tauri app (universal)
        run: npm run tauri build -- --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      # Своя постоянная подпись (самоподписанный сертификат из секретов):
      # macOS узнаёт обновлённые clod-helper и clod-bridge и не показывает
      # «Добавлены фоновые объекты» после каждого обновления. Без секретов
      # шаг ничего не делает — сборка остаётся с подписью ad-hoc.
      - name: Sign with own certificate
        env:
          CLOD_SIGN_P12_BASE64: ${{ secrets.MACOS_SIGN_P12 }}
          CLOD_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          B=src-tauri/target/universal-apple-darwin/release/bundle
          sh scripts/sign-mac.sh "$B/macos/Clod Helper.app" "$(ls "$B"/dmg/*.dmg)"

      - name: Collect artifacts
        run: |
          mkdir -p release-assets
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*_${V}_*.dmg release-assets/
          ls -la release-assets

      # Суммы - от собранного и подписанного .dmg, отдельным артефактом
      # (см. комментарий в сборке Windows).
      - name: Checksums of built installers
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p build-sums
          # Имя файла с пробелом ("Clod Helper_X_universal.dmg"): цикл, не awk.
          : > build-sums/sums-macos.txt
          for f in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*_${V}_*.dmg; do
            h=$(shasum -a 256 "$f" | cut -d' ' -f1)
            printf '%s  %s
' "$h" "$(basename "$f")" >> build-sums/sums-macos.txt
          done
          test -s build-sums/sums-macos.txt
          cat build-sums/sums-macos.txt

      - name: Upload artifacts (workflow run)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clod-helper-macos
          path: release-assets/*

      - name: Upload installer checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-sums-macos
          path: build-sums/sums-macos.txt
          if-no-files-found: error

  # Один job публикует релиз: два параллельных softprops/action-gh-release
  # гонялись бы за создание одного релиза. Ждёт оба билда; упавший macOS-билд
  # не блокирует выпуск Windows-версии (публикуется то, что собралось).
  release:
    needs: [build, build-macos]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: clod-helper-*
          path: release-assets
          merge-multiple: true

      # Контрольные суммы: встроенное обновление Clod Helper сверяет скачанный
      # .dmg с этим файлом (подписи Apple нет — целостность проверяем так).
      - name: Checksums
        run: cd release-assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # «Что нового» — из src/whats-new.json (его же показывает приложение
      # после обновления). Окно обновления в старой версии читает пункты
      # секции «## Что нового» из описания релиза (updater::highlights).
      - name: Checkout whats-new and manifest script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            src/whats-new.json
            scripts/make-manifest.mjs
            scripts/release-notes.mjs
            scripts/lib/controls.mjs
          sparse-checkout-cone-mode: false
          path: src-repo

      # Описание релиза: кнопки скачивания, «Что нового», установка под
      # спойлерами. Формат секции «Что нового» читают старые версии — см.
      # комментарий в scripts/release-notes.mjs.
      - name: Release notes
        run: |
          node src-repo/scripts/release-notes.mjs "$GITHUB_REF_NAME" src-repo/src/whats-new.json > release-notes.md
          cat release-notes.md

      # Манифест обновления: программа (≥0.8.9) проверяет обновления по нему —
      # releases/latest/download/latest.json идёт через сайт и CDN, без лимита
      # API. Подписывает его разработчик у себя (scripts/publish-release.mjs:
      # пересчитывает суммы, подписывает ed25519, публикует) — поэтому релиз
      # создаётся черновиком: пользователи не увидят его до подписи.
      # SHA256SUMS.txt и описание — для старых версий (≤0.8.8), они читают API.
      - name: Update manifest
        run: node src-repo/scripts/make-manifest.mjs release-assets "$GITHUB_REF_NAME" src-repo/src/whats-new.json

      - name: Create GitHub Release (draft until signed)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*
          # «Full Changelog» не нужен: старые теги удаляются, ссылка вела бы в никуда.
          generate_release_notes: false
          draft: true
          prerelease: false
          body_path: release-notes.md
