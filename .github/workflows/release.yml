name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install npm dependencies
        run: npm ci

      # clod-bridge.exe не хранится в git (.gitignore) — собираем из bridge/.
      - name: Build bridge
        run: npm run bridge:build

      - name: Build Tauri app
        run: npm run tauri build
        env:
          # Pin Tauri bundler to plain (no signing) since we publish unsigned.
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Collect artifacts
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/release/bundle"
          $out = "release-assets"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Get-ChildItem -Path "$bundleDir/nsis/*-setup.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName $out }
          Get-ChildItem $out

      - name: Upload artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: clod-helper-windows
          path: release-assets/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Установка

            1. Скачайте `Clod_Helper_*_x64-setup.exe` ниже.
            2. ПКМ → Свойства → «Разблокировать» → ОК.
            3. Двойной клик. SmartScreen → «Подробнее» → «Выполнить в любом случае».
            4. Установщик добавит ярлык. Запускайте.

            Программа не подписана — Windows перестраховывается. Исходники открыты.

            ## macOS (Apple Silicon и Intel, macOS 11+)

            1. Скачайте `*_universal.dmg`, откройте и перетащите Clod Helper в «Программы».
            2. Первый запуск: ПКМ по приложению → «Открыть» → «Открыть».
               На macOS 15+: если кнопки «Открыть» нет — Системные настройки → Конфиденциальность и безопасность → «Всё равно открыть».
            3. Приложение не заверено Apple (Developer ID) — поэтому такое предупреждение. Исходники открыты.

  build-macos:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            bridge/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build bridge (universal)
        run: npm run bridge:build:mac

      - name: Build Tauri app (universal)
        run: npm run tauri build -- --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Collect artifacts
        run: |
          mkdir -p release-assets
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg release-assets/
          ls -la release-assets

      - name: Upload artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: clod-helper-macos
          path: release-assets/*

      # Тело релиза пишет Windows-job; здесь только добавляем .dmg.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
