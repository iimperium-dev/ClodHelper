name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install npm dependencies
        run: npm ci

      # clod-bridge.exe не хранится в git (.gitignore) — собираем из bridge/.
      - name: Build bridge
        run: npm run bridge:build

      - name: Build Tauri app
        run: npm run tauri build
        env:
          # Pin Tauri bundler to plain (no signing) since we publish unsigned.
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Collect artifacts
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/release/bundle"
          $out = "release-assets"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Get-ChildItem -Path "$bundleDir/nsis/*-setup.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName $out }
          Get-ChildItem $out

      - name: Upload artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: clod-helper-windows
          path: release-assets/*

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            bridge/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build bridge (universal)
        run: npm run bridge:build:mac

      - name: Build Tauri app (universal)
        run: npm run tauri build -- --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Collect artifacts
        run: |
          mkdir -p release-assets
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg release-assets/
          ls -la release-assets

      - name: Upload artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: clod-helper-macos
          path: release-assets/*

  # Один job публикует релиз: два параллельных softprops/action-gh-release
  # гонялись бы за создание одного релиза. Ждёт оба билда; упавший macOS-билд
  # не блокирует выпуск Windows-версии (публикуется то, что собралось).
  release:
    needs: [build, build-macos]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: clod-helper-*
          path: release-assets
          merge-multiple: true

      # Контрольные суммы: встроенное обновление Clod Helper сверяет скачанный
      # .dmg с этим файлом (подписи Apple нет — целостность проверяем так).
      - name: Checksums
        run: cd release-assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # «Что нового» — из src/whats-new.json (его же показывает приложение
      # после обновления). Окно обновления в старой версии читает пункты
      # секции «## Что нового» из описания релиза (updater::highlights).
      - name: Checkout whats-new and manifest script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/whats-new.json
            scripts/make-manifest.mjs
          sparse-checkout-cone-mode: false
          path: src-repo

      - name: Release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          {
            items=$(jq -r --arg v "$v" '.[$v].items[]? | "- " + .' src-repo/src/whats-new.json)
            if [ -n "$items" ]; then
              printf '## Что нового\n\n%s\n\n' "$items"
            fi
            cat <<'EOF'
          ## Установка

          1. Скачайте `Clod_Helper_*_x64-setup.exe` ниже.
          2. ПКМ → Свойства → «Разблокировать» → ОК.
          3. Двойной клик. SmartScreen → «Подробнее» → «Выполнить в любом случае».
          4. Установщик добавит ярлык. Запускайте.

          Программа не подписана — Windows перестраховывается. Исходники открыты.

          ## macOS (Apple Silicon и Intel, macOS 11+)

          1. Скачайте `*_universal.dmg`, откройте и перетащите Clod Helper в «Программы».
          2. Первый запуск: ПКМ по приложению → «Открыть» → «Открыть».
             На macOS 15+: если кнопки «Открыть» нет — Системные настройки → Конфиденциальность и безопасность → «Всё равно открыть».
          3. Приложение не заверено Apple (Developer ID) — поэтому такое предупреждение. Исходники открыты.
          EOF
          } > release-notes.md
          cat release-notes.md

      # Манифест обновления: программа (≥0.8.9) проверяет обновления по нему —
      # releases/latest/download/latest.json идёт через сайт и CDN, без лимита
      # API. Подписывает его разработчик у себя (scripts/publish-release.mjs:
      # пересчитывает суммы, подписывает ed25519, публикует) — поэтому релиз
      # создаётся черновиком: пользователи не увидят его до подписи.
      # SHA256SUMS.txt и описание — для старых версий (≤0.8.8), они читают API.
      - name: Update manifest
        run: node src-repo/scripts/make-manifest.mjs release-assets "$GITHUB_REF_NAME" src-repo/src/whats-new.json

      - name: Create GitHub Release (draft until signed)
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: true
          prerelease: false
          body_path: release-notes.md
