name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install npm dependencies
        run: npm ci

      # clod-bridge.exe не хранится в git (.gitignore) — собираем из bridge/.
      - name: Build bridge
        run: npm run bridge:build

      # Кэш хранит src-tauri/target целиком — с установщиками прошлых версий.
      # Без очистки в релиз 0.8.12 попал старый 0.8.11, и манифест указал на него.
      - name: Clean old installers
        shell: pwsh
        run: Remove-Item -Recurse -Force src-tauri/target/release/bundle -ErrorAction SilentlyContinue

      - name: Build Tauri app
        run: npm run tauri build
        env:
          # Pin Tauri bundler to plain (no signing) since we publish unsigned.
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Collect artifacts
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/release/bundle"
          $out = "release-assets"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          Get-ChildItem -Path "$bundleDir/nsis/*_${version}_*-setup.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName $out }
          Get-ChildItem $out

      - name: Upload artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: clod-helper-windows
          path: release-assets/*

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            bridge/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build bridge (universal)
        run: npm run bridge:build:mac

      - name: Build Tauri app (universal)
        run: npm run tauri build -- --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      # Своя постоянная подпись (самоподписанный сертификат из секретов):
      # macOS узнаёт обновлённые clod-helper и clod-bridge и не показывает
      # «Добавлены фоновые объекты» после каждого обновления. Без секретов
      # шаг ничего не делает — сборка остаётся с подписью ad-hoc.
      - name: Sign with own certificate
        env:
          CLOD_SIGN_P12_BASE64: ${{ secrets.MACOS_SIGN_P12 }}
          CLOD_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          B=src-tauri/target/universal-apple-darwin/release/bundle
          sh scripts/sign-mac.sh "$B/macos/Clod Helper.app" "$(ls "$B"/dmg/*.dmg)"

      - name: Collect artifacts
        run: |
          mkdir -p release-assets
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*_${V}_*.dmg release-assets/
          ls -la release-assets

      - name: Upload artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: clod-helper-macos
          path: release-assets/*

  # Один job публикует релиз: два параллельных softprops/action-gh-release
  # гонялись бы за создание одного релиза. Ждёт оба билда; упавший macOS-билд
  # не блокирует выпуск Windows-версии (публикуется то, что собралось).
  release:
    needs: [build, build-macos]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: clod-helper-*
          path: release-assets
          merge-multiple: true

      # Контрольные суммы: встроенное обновление Clod Helper сверяет скачанный
      # .dmg с этим файлом (подписи Apple нет — целостность проверяем так).
      - name: Checksums
        run: cd release-assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # «Что нового» — из src/whats-new.json (его же показывает приложение
      # после обновления). Окно обновления в старой версии читает пункты
      # секции «## Что нового» из описания релиза (updater::highlights).
      - name: Checkout whats-new and manifest script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/whats-new.json
            scripts/make-manifest.mjs
            scripts/release-notes.mjs
          sparse-checkout-cone-mode: false
          path: src-repo

      # Описание релиза: кнопки скачивания, «Что нового», установка под
      # спойлерами. Формат секции «Что нового» читают старые версии — см.
      # комментарий в scripts/release-notes.mjs.
      - name: Release notes
        run: |
          node src-repo/scripts/release-notes.mjs "$GITHUB_REF_NAME" src-repo/src/whats-new.json > release-notes.md
          cat release-notes.md

      # Манифест обновления: программа (≥0.8.9) проверяет обновления по нему —
      # releases/latest/download/latest.json идёт через сайт и CDN, без лимита
      # API. Подписывает его разработчик у себя (scripts/publish-release.mjs:
      # пересчитывает суммы, подписывает ed25519, публикует) — поэтому релиз
      # создаётся черновиком: пользователи не увидят его до подписи.
      # SHA256SUMS.txt и описание — для старых версий (≤0.8.8), они читают API.
      - name: Update manifest
        run: node src-repo/scripts/make-manifest.mjs release-assets "$GITHUB_REF_NAME" src-repo/src/whats-new.json

      - name: Create GitHub Release (draft until signed)
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          # «Full Changelog» не нужен: старые теги удаляются, ссылка вела бы в никуда.
          generate_release_notes: false
          draft: true
          prerelease: false
          body_path: release-notes.md
